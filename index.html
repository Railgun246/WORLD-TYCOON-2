function renderWorldNet(){
  const w=460,h=230;
  const list=[...G.countries].sort((a,b)=>b.gdp-a.gdp).slice(0,24);
  const cols=6, rows=Math.ceil(list.length/cols);
  const cellW=w/cols, cellH=h/rows;
  let svg=`<svg id="worldnet" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  list.forEach((c,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const cx=cellW*col+cellW/2, cy=cellH*row+cellH/2+6;
    const r=clamp(Math.sqrt(c.gdp)*0.9,7,26);
    const t=(c.approval-50)/50;
    let color = t>0 ? `rgba(63,217,199,${0.35+0.5*t})` : `rgba(240,104,92,${0.35+0.5*-t})`;
    if(c.collapsed) color="rgba(90,90,100,0.5)";
    const owned=G.companies.some(co=>co.country===c.id && hShares(co.id)>0);
    const strokeColor = c.collapsed?'#5C6980': c.conflict?'#F0685C': owned?'#E8B84B':'#232C3B';
    svg+=`<g data-open-country="${c.id}" style="cursor:pointer;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="${strokeColor}" stroke-width="${(owned||c.conflict||c.collapsed)?2:1}"/>
      <text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="11">${c.flag}</text>
      <text class="node-label" x="${cx}" y="${cy+r+9}" text-anchor="middle">${c.name.length>4?c.name.slice(0,4):c.name}</text>
    </g>`;
  });
  svg+=`</svg>`;
  return svg;
}

/* =========================================================================
   17. CANDLESTICK CHART
   ========================================================================= */
function aggregateCandles(candles, timeframe){
  if(!candles || !candles.length) return [];
  const bucketSize = timeframe==='day'?1: timeframe==='week'?7: timeframe==='month'?30: 365;
  if(bucketSize===1) return candles.slice(-60);
  const buckets=new Map();
  candles.forEach(c=>{
    const key=Math.floor(c.d/bucketSize);
    if(!buckets.has(key)) buckets.set(key,[]);
    buckets.get(key).push(c);
  });
  const out=[];
  [...buckets.keys()].sort((a,b)=>a-b).forEach(k=>{
    const arr=buckets.get(k);
    out.push({d:arr[arr.length-1].d, o:arr[0].o, h:Math.max(...arr.map(x=>x.h)), l:Math.min(...arr.map(x=>x.l)), c:arr[arr.length-1].c, v:arr.reduce((a,x)=>a+x.v,0)});
  });
  return out.slice(-40);
}
function renderCandleChart(co, timeframe){
  const data=aggregateCandles(co.candles, timeframe);
  if(data.length<2){
    return `<div class="chart-wrap"><div class="empty-state">チャートデータを蓄積中です。時間を進めるとローソク足が表示されます。</div></div>`;
  }
  const W=460,H=170,VH=42,padTop=8,padBottom=4;
  const maxP=Math.max(...data.map(d=>d.h)), minP=Math.min(...data.map(d=>d.l));
  const range=Math.max(maxP-minP,maxP*0.01,1);
  const maxV=Math.max(...data.map(d=>d.v),1);
  const cw=W/data.length;
  const cbw=Math.max(2,cw*0.6);
  const yFor=p=>padTop+(H-padTop-padBottom)*(1-(p-minP)/range);
  let svg=`<svg viewBox="0 0 ${W} ${H+VH+14}" xmlns="http://www.w3.org/2000/svg" width="100%">`;
  // gridlines + price labels
  for(let i=0;i<=2;i++){
    const p=minP+range*i/2; const y=yFor(p);
    svg+=`<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="#232C3B" stroke-width="1"/>`;
    svg+=`<text class="chart-axis-label" x="${W-2}" y="${(y-2).toFixed(1)}" text-anchor="end">¥${fmtNum(Math.round(p),0)}</text>`;
  }
  data.forEach((d,i)=>{
    const x=cw*i+cw/2;
    const up=d.c>=d.o;
    const cls=up?'candle-up':'candle-down';
    svg+=`<line x1="${x.toFixed(1)}" y1="${yFor(d.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${yFor(d.l).toFixed(1)}" class="${cls}" stroke-width="1"/>`;
    const yO=yFor(d.o), yC=yFor(d.c);
    const top=Math.min(yO,yC), bh=Math.max(1,Math.abs(yC-yO));
    svg+=`<rect x="${(x-cbw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${cbw.toFixed(1)}" height="${bh.toFixed(1)}" class="${cls}"/>`;
    const vh=(d.v/maxV)*VH;
    svg+=`<rect x="${(x-cbw/2).toFixed(1)}" y="${(H+14+VH-vh).toFixed(1)}" width="${cbw.toFixed(1)}" height="${vh.toFixed(1)}" class="${up?'vol-up':'vol-down'}"/>`;
  });
  svg+=`<line x1="0" y1="${H+14}" x2="${W}" y2="${H+14}" stroke="#232C3B" stroke-width="1"/>`;
  svg+=`<text class="chart-axis-label" x="2" y="${H+12}">出来高</text>`;
  svg+=`</svg>`;
  return `<div class="chart-wrap">${svg}</div>`;
}

      if(resource&&country) document.getElementById('res-price-preview').textContent=`現地価格指数: ${resourceLocalPrice(resource,country).toFixed(1)}`;
    };

    document.getElementById('btn-res-buy').addEventListener('click',()=>{

}

   19. ASSETS SCREEN
   ========================================================================= */
function renderAssets(){
  const el=document.getElementById('screen-assets');
  const nw=netWorth();
  const held=G.companies.filter(co=>hShares(co.id)>0);
  const reVal=G.player.realEstate.reduce((a,r)=>a+r.landValue,0);
  const plVal=G.player.plants.reduce((a,p)=>a+p.cost*0.85,0);
  const resVal=G.player.resourceHoldings.reduce((a,h)=>{ const r=G.resources.find(x=>x.id===h.resource); return a+(r?(h.units*r.price)/1e6:0); },0);
  const bankVal=G.player.bank?G.player.bank.capital:0;
  const patVal=G.player.patents.reduce((a,p)=>a+p.value,0);
  const hist=G.player.history.slice(-40);
  const maxH=Math.max(...hist.map(h=>h.netWorth),1), minH=Math.min(...hist.map(h=>h.netWorth),0);
  const chartW=460,chartH=90;
  const pts=hist.map((h,i)=>{
    const x=hist.length>1? (i/(hist.length-1))*chartW : 0;
    const y=chartH - ((h.netWorth-minH)/Math.max(maxH-minH,0.01))*chartH;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const pw=G.player._powerBreakdown||{};
  el.innerHTML=`
    <div class="panel">
      <div class="panel-title">総資産推移</div>
      <div class="gauge-num gold">${fmtYen(nw)}</div>
      <svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="90" style="margin-top:8px;">
        <polyline points="${pts}" fill="none" stroke="#E8B84B" stroke-width="2"/>
      </svg>
    </div>
    <div class="panel">
      <div class="panel-title">資産内訳</div>
      <div class="row"><div class="row-main row-title">現金</div><div class="row-right row-val">${fmtYen(G.player.cash)}</div></div>
      <div class="row"><div class="row-main row-title">保有株式評価額（${held.length}社）</div><div class="row-right row-val">${fmtYen(nw-G.player.cash-reVal-plVal-resVal-bankVal-patVal)}</div></div>
      <div class="row"><div class="row-main row-title">不動産（${G.player.realEstate.length}件）</div><div class="row-right row-val">${fmtYen(reVal)}</div></div>
      <div class="row"><div class="row-main row-title">発電所（${G.player.plants.length}件）</div><div class="row-right row-val">${fmtYen(plVal)}</div></div>
      <div class="row"><div class="row-main row-title">資源ポジション（${G.player.resourceHoldings.length}件）</div><div class="row-right row-val">${fmtYen(resVal)}</div></div>
      <div class="row"><div class="row-main row-title">銀行資本</div><div class="row-right row-val">${fmtYen(bankVal)}</div></div>
      <div class="row"><div class="row-main row-title">特許価値（${G.player.patents.length}件）</div><div class="row-right row-val">${fmtYen(patVal)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">WORLD POWER 内訳</div>
      ${[["金融影響力",pw.finInfluence],["企業支配力",pw.corpInfluence],["政治影響力",pw.polInfluence],["技術影響力",pw.techInfluence],["情報影響力",pw.infoInfluence],["資源影響力",pw.resInfluence]].map(([label,v])=>`
        <div style="margin-bottom:8px;">
          <div class="flex-between"><span class="row-sub">${label}</span><span class="mono" style="font-size:11px;">${(v||0).toFixed(0)}</span></div>
          <div class="pillbar"><div style="width:${v||0}%;background:var(--teal);"></div></div>
        </div>
      `).join('')}
    </div>
  `;
  wireCommon(el);
}

function renderMna(){

function mnaCompanyHtml(){
  const candidates=[...G.companies].sort((a,b)=>ownershipPct(b)-ownershipPct(a)||b.marketCap-a.marketCap).slice(0,60);
  return `
    <div class="panel">
      <div class="row-sub">株式を10%→20%→33%→50%→67%→90%→100%と積み増して企業を支配下に置けます。TOB（公開買付）でプレミアムを払えば一気に比率を引き上げられます。市場支配率が高まると規制当局に警戒されることがあります。</div>
    </div>
    <div class="panel">
      ${candidates.map(co=>{
        const pct=ownershipPct(co);
        const country=G.countries.find(c=>c.id===co.country);
        const tier = pct>=100?"完全子会社": pct>=90?"90%支配": pct>=67?"67%支配": pct>=50?"経営権取得": pct>=33?"33%(拒否権)": pct>=20?"20%(持分法)": pct>=10?"10%(大株主)": pct>0?"保有中":"未保有";
        return `<div class="row" data-open-company="${co.id}">
          <div class="row-main">
            <div class="row-title">${co.flag} ${escapeHtml(co.name)} ${country&&country.regulatedUntil>G.day?'<span class="tag warn">規制中</span>':''}</div>
            <div class="row-sub">${co.sector} ・ ${fmtYen(co.marketCap)} ・ <span class="${pct>0?'gold':'dim'}">${tier}</span></div>

          <div class="row-right"><div class="row-val">${pct.toFixed(1)}%</div></div>
        </div>`;
      }).join('')}
    </div>
  `;
}

  return `
    <div class="panel">

function mnaContractHtml(){
  const open=G.contracts.filter(c=>c.status==='open');
  const active=G.contracts.filter(c=>c.status==='active');
  return `
    <div class="panel">
      <div class="panel-title">受注可能な国家案件<span class="dim">${open.length}件</span></div>
      ${open.length? open.map(ct=>`<div class="row">
        <div class="row-main"><div class="row-title">${ct.flag} ${ct.countryName} ・ ${ct.title}</div>
        <div class="row-sub">初期費用 ${fmtYen(ct.cost)} ・ 成功時報酬 ${fmtYen(ct.reward)} ・ 成功率 ${(ct.successChance*100).toFixed(0)}%</div></div>

      <div class="panel-title">進行中の案件<span class="dim">${active.length}件</span></div>
      ${active.length? active.map(ct=>`<div class="row">
        <div class="row-main"><div class="row-title">${ct.flag} ${ct.countryName} ・ ${ct.title}</div>
        <div class="row-sub">完了予定 DAY ${ct.resolveDay}（残り約${Math.max(0,ct.resolveDay-G.day)}日）</div></div>

  `;
}
function wireMnaTab(tab, el){
  if(tab==='infra'){
    document.getElementById('infra-country').addEventListener('change',e=>{ G.uiInfraCountry=e.target.value; });
    document.getElementById('btn-infra').addEventListener('click',()=>{
      const cId=document.getElementById('infra-country').value;
      const amt=parseFloat(document.getElementById('infra-amount').value)||0;
      const r=investInfrastructure(cId,amt);
      if(r.ok){ toast("インフラ投資を実行しました"); renderAll(); } else toast(r.msg);
    });
  } else if(tab==='contract'){
    el.querySelectorAll('[data-accept-ct]').forEach(b=>b.addEventListener('click',()=>{
      const r=acceptContract(b.dataset.acceptCt);
      if(r.ok){ toast("案件を受注しました"); renderAll(); } else toast(r.msg);
    }));
  }
}

function renderPeople(){
  const el=document.getElementById('screen-people');
  if(!G.uiCountry) G.uiCountry=G.countries[0].id;
  const country=G.countries.find(c=>c.id===G.uiCountry)||G.countries[0];
  recalcCountryInfluence(country);
  const cached=G.voiceViewCache[country.id];
  const needFresh = !cached || (cached.source==='template' && (G.day-cached.day)>=7);
  if(needFresh){ G.voiceViewCache[country.id]={source:'template', voices:generateVoices(country,6), day:G.day}; }
  const voiceState=G.voiceViewCache[country.id];
  const inf=country.influence;
  const pol=country.politician;
  const eligiblePolicies=POLICIES;
  el.innerHTML=`
    <div class="panel">
      <div class="panel-title">WORLD PEOPLE</div>
      <select id="country-select">
        ${G.countries.map(c=>`<option value="${c.id}" ${c.id===G.uiCountry?'selected':''}>${c.flag} ${c.name}${c.collapsed?'（崩壊）':c.conflict?'（紛争）':''}</option>`).join('')}
      </select>
    </div>
    <div class="panel">
      <div class="panel-title">${country.flag} ${country.name}</div>
      ${country.collapsed?`<div class="tag warn" style="margin-bottom:8px;">国家崩壊状態（復興まで残り約${Math.ceil(country.collapseRemaining)}日）</div>`:''}
      ${country.conflict?`<div class="tag warn" style="margin-bottom:8px;">${country.conflict.name}（残り約${Math.ceil(country.conflict.remaining)}日）</div>`:''}
      <div class="grid3">
        <div class="metric-box"><div class="lbl">人口</div><div class="val">${(country.population/10000).toFixed(country.population>10000?1:2)}億人</div></div>
        <div class="metric-box"><div class="lbl">幸福度</div><div class="val ${country.happiness>55?'teal':country.happiness<40?'red':''}">${country.happiness.toFixed(0)}</div></div>
        <div class="metric-box"><div class="lbl">政情安定度</div><div class="val ${country.stability>60?'teal':country.stability<30?'red':''}">${country.stability.toFixed(0)}</div></div>
        <div class="metric-box"><div class="lbl">物価不満</div><div class="val">${clamp(country.inflation*10,0,100).toFixed(0)}</div></div>
        <div class="metric-box"><div class="lbl">失業不安</div><div class="val">${clamp(country.unemployment*6,0,100).toFixed(0)}</div></div>
        <div class="metric-box"><div class="lbl">政府支持率</div><div class="val">${country.govSupport.toFixed(0)}%</div></div>
        <div class="metric-box"><div class="lbl">社会不安</div><div class="val ${country.unrest>50?'red':''}">${country.unrest.toFixed(0)}</div></div>
        <div class="metric-box"><div class="lbl">貧困率</div><div class="val">${country.poverty.toFixed(0)}%</div></div>
        <div class="metric-box"><div class="lbl">対プレイヤー緊張度</div><div class="val ${country.tension>60?'red':''}">${(country.tension||0).toFixed(0)}</div></div>
        <div class="metric-box"><div class="lbl">プレイヤー評価</div><div class="val ${country.approval>55?'teal':country.approval<40?'red':''}">${country.approval.toFixed(0)}</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">PLAYER INFLUENCE<span class="dim">政府への影響力</span></div>
      <div class="gauge-wrap">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="30" fill="none" stroke="#232C3B" stroke-width="7"/>
          <circle cx="36" cy="36" r="30" fill="none" stroke="url(#pg)" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="${2*Math.PI*30}" stroke-dashoffset="${2*Math.PI*30*(1-inf.total/100)}"
            transform="rotate(-90 36 36)"/>
          <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#9C8CF0"/><stop offset="100%" stop-color="#E8B84B"/></linearGradient></defs>
          <text x="36" y="41" text-anchor="middle" font-family="IBM Plex Mono" font-size="17" fill="#E7ECF3" font-weight="600">${inf.total.toFixed(0)}</text>
        </svg>
        <div class="gauge-desc">${influenceTierLabel(inf.total)}<br>経済・企業・メディア・政策活動の4つの経路から積み上がる。現金を払うだけでは上がらない。</div>
      </div>
      <div style="margin-top:10px;">
        ${[["経済影響",inf.econ],["企業影響",inf.corp],["メディア影響",inf.media],["政策活動",inf.policy]].map(([label,v])=>`
          <div style="margin-bottom:7px;">
            <div class="flex-between"><span class="row-sub">${label}</span><span class="mono" style="font-size:11px;">${v.toFixed(0)}</span></div>
            <div class="pillbar"><div style="width:${v}%;background:var(--purple);"></div></div>

        <div>

    </div>

    <div class="panel">
      <div class="panel-title">政策提案</div>
      ${eligiblePolicies.map(p=>{
        const locked=inf.total<p.minInfluence;
        return `<div class="row">
          <div class="row-main">
            <div class="row-title">${escapeHtml(p.name)} <span class="tag ${locked?'warn':'info'}">${p.category}</span></div>
            <div class="row-sub">${escapeHtml(p.desc)}</div>
            <div class="row-sub">必要影響力 ${p.minInfluence} ・ コスト ${fmtYen(p.cost)}</div>
          </div>
          <div class="row-right"><button class="btn ${locked?'ghost':'primary'} btn-sm" data-propose="${p.id}" ${locked?'disabled':''}>提案</button></div>
        </div>`;
      }).join('')}
    </div>

    <div class="panel">
      <div class="panel-title">市民の声<button class="btn ghost" id="btn-ai-voice" style="font-size:11px;padding:6px 10px;">✨ AIで生成</button></div>
      <div id="voice-list">
        ${voiceState.voices.map(v=>`<div class="voice-card"><div class="voice-role">${escapeHtml(v.role)}${voiceState.source==='ai'?' <span class="dim" style="font-weight:400;">AI生成</span>':''}</div><div class="voice-text">${escapeHtml(v.text)}</div></div>`).join('')}
      </div>
    </div>
  `;
  wireCommon(el);
  document.getElementById('country-select').addEventListener('change',e=>{ G.uiCountry=e.target.value; renderPeople(); });
  document.getElementById('btn-lobby').addEventListener('click',()=>{
    const amt=parseFloat(document.getElementById('lobby-amount').value)||0;
    const r=lobbyActivity(country.id,amt);
    if(r.ok){ toast("ロビー活動を実施しました"); renderAll(); } else toast(r.msg);
  });
  const negoBtn=document.getElementById('btn-negotiate');
  if(negoBtn) negoBtn.addEventListener('click',()=>openNegotiationModal(country.id));
  el.querySelectorAll('[data-propose]').forEach(b=>b.addEventListener('click',()=>{
    const r=proposePolicy(country.id,b.dataset.propose);
    if(r.ok){ openPolicyResultModal(r); renderAll(); } else toast(r.msg);
  }));
  document.getElementById('btn-ai-voice').addEventListener('click', async ()=>{
    const btn=document.getElementById('btn-ai-voice');
    const list=document.getElementById('voice-list');
    btn.disabled=true; btn.textContent="生成中…";
    list.innerHTML=`<div class="loading-dots">AIが${country.name}の国民の声を生成しています…</div>`;
    try{
      const aiVoices=await generateAIVoices(country);
      G.voiceViewCache[country.id]={source:'ai', voices:aiVoices, day:G.day};
      list.innerHTML=aiVoices.map(v=>`<div class="voice-card"><div class="voice-role">${escapeHtml(v.role)} <span class="dim" style="font-weight:400;">AI生成</span></div><div class="voice-text">${escapeHtml(v.text)}</div></div>`).join('');
    }catch(err){
      console.error(err);
      list.innerHTML=`<div class="empty-state">AI生成に失敗しました。通信環境をご確認のうえ再度お試しください。</div>`;
      toast("AI生成に失敗しました");
    }
    btn.disabled=false; btn.textContent="✨ AIで生成";

function renderOrderBook(co, book){
  const asksDisplay=[...book.asks].reverse();
  const row=(shares,price,side)=>`<div style="display:flex;justify-content:space-between;font-family:var(--font-m);font-size:11px;padding:3px 6px;background:${side==='ask'?'rgba(240,104,92,0.08)':'rgba(63,217,199,0.08)'};">
    <span class="${side==='ask'?'red':'teal'}">${fmtNum(shares,0)}</span><span class="dim">${fmtPrice(price)}</span></div>`;
  let html=`<div class="chart-wrap" style="padding:4px;">`;
  asksDisplay.forEach(l=>html+=row(l.shares,l.price,'ask'));
  html+=`<div style="text-align:center;font-family:var(--font-m);font-size:12px;font-weight:700;padding:5px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">${fmtPrice(co.price)}</div>`;
  book.bids.forEach(l=>html+=row(l.shares,l.price,'bid'));
  html+=`</div>`;
  return html;
}

        <div class="panel" style="background:var(--panel2);margin-bottom:10px;padding:12px;">
          <div class="flex-between">
            <div class="row-title">WORLD ${String(s.slot).padStart(2,'0')} ${s.slot===currentSlot?'<span class="tag control">プレイ中</span>':''}</div>
          </div>
          ${s.meta?`
            <div class="row-sub" style="margin-top:4px;">${s.meta.dateText} ・ プレイ時間 ${formatPlayTime(s.meta.playTimeSeconds)}</div>
            <div class="grid3" style="margin-top:8px;">
              <div class="metric-box"><div class="lbl">資産</div><div class="val gold">${fmtYen(s.meta.netWorth)}</div></div>
              <div class="metric-box"><div class="lbl">支配企業</div><div class="val">${s.meta.companiesControlled}社</div></div>
              <div class="metric-box"><div class="lbl">影響国家</div><div class="val">${s.meta.countriesInfluenced}ヶ国</div></div>
            </div>
            <div class="btn-row" style="margin-top:10px;">
              <button class="btn primary btn-sm" data-load-slot="${s.slot}" ${s.slot===currentSlot?'disabled':''}>LOAD</button>
              <button class="btn danger btn-sm" data-delete-slot="${s.slot}">削除</button>
            </div>
          `:`
            <div class="row-sub" style="margin-top:4px;">空きスロット</div>
            <button class="btn ghost btn-sm" data-newworld-slot="${s.slot}" style="margin-top:8px;">この枠に新しい世界を作る</button>
          `}
        </div>
      `).join('')}
    `;
    document.getElementById('modal-body').innerHTML=html;
    document.querySelectorAll('[data-load-slot]').forEach(b=>b.addEventListener('click', async ()=>{
      const n=parseInt(b.dataset.loadSlot,10);
      if(!confirm(`WORLD ${String(n).padStart(2,'0')} をロードしますか？`)) return;
      await saveGame();
      const r=await loadSlot(n);
      if(r.ok){
        if(r.restoredFromBackup) toast('セーブデータに問題があったため、バックアップから復元しました');
        recalcWorldPower();
        closeModal();
        switchScreen('world');
        renderTopbar();
        toast(`WORLD ${String(n).padStart(2,'0')} をロードしました`);
      } else toast('ロードに失敗しました');
    }));
    document.querySelectorAll('[data-newworld-slot]').forEach(b=>b.addEventListener('click', async ()=>{
      const n=parseInt(b.dataset.newworldSlot,10);
      if(!confirm(`WORLD ${String(n).padStart(2,'0')} に新しい世界を作成しますか？`)) return;
      await startNewWorldInSlot(n);
      closeModal();
      const step=tutorialCurrentStep();
      if(step && step.targetScreen) switchScreen(step.targetScreen); else switchScreen('world');
      renderTopbar();
      renderTutorialUI();
      toast(`WORLD ${String(n).padStart(2,'0')} を作成しました`);
    }));
    document.querySelectorAll('[data-delete-slot]').forEach(b=>b.addEventListener('click', async ()=>{
      const n=parseInt(b.dataset.deleteSlot,10);
      if(n===currentSlot){ toast('プレイ中のスロットは削除できません'); return; }
      if(!confirm(`WORLD ${String(n).padStart(2,'0')} を完全に削除します。よろしいですか？`)) return;
      await deleteSlot(n);
      openSaveLoadModal();
    }));
  })();
}

/* =========================================================================
   25. TIME CONTROL
   ========================================================================= */
const SPEED_DAYS={day:1, week:7, month:30, year:365};
function doAdvance(){
  simulateStep(SPEED_DAYS[G.speed]);
  saveGame();
  renderAll();
}
let autoplayTimer=null;
function toggleAutoplay(){
  G.playing=!G.playing;
  if(G.playing){
    autoplayTimer=setInterval(()=>{ doAdvance(); },1600);
    toast("自動進行を開始しました");
  } else {
    clearInterval(autoplayTimer); autoplayTimer=null;
    toast("自動進行を停止しました");
  }
  saveGame();
  renderWorld();
}

/* =========================================================================
   26. BOOT
   ========================================================================= */
async function boot(){
  await migrateLegacySaveIfNeeded();
  const slots=await listSaveSlots();
  const existing=slots.filter(s=>s.meta);
  if(existing.length===0){
    currentSlot=1;
    G=initWorld();
    recalcWorldPower();
    startTutorial();
    await saveGame();
    await initApp();
    return;
  }
  const activeRaw=await storageGet(ACTIVE_SLOT_KEY);
  let activeSlotNum = activeRaw? parseInt(activeRaw,10) : existing[0].slot;
  if(!slots.find(s=>s.slot===activeSlotNum && s.meta)) activeSlotNum=existing[0].slot;
  showBootChoiceScreen(activeSlotNum, slots);
}
function formatPlayTime(sec){
  sec=sec||0;
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  if(h<=0) return `${m}分`;
  return `${h}時間${m}分`;
}
function bootScreenHtml(activeSlotNum, allSlots){
  const meta=(allSlots.find(s=>s.slot===activeSlotNum)||{}).meta;
  return `
    <div class="tut-badge">CONTINUE</div>
    <div class="tut-lines">
      <div class="tut-line">WORLD ${String(activeSlotNum).padStart(2,'0')}</div>
      <div class="tut-line small">${meta?meta.dateText:''}</div>
    </div>
    <div class="tut-summary-table">
      <div class="tut-summary-row"><span>総資産</span><span class="mono gold">${meta?fmtYen(meta.netWorth):'-'}</span></div>
      <div class="tut-summary-row"><span>支配企業</span><span class="mono">${meta?meta.companiesControlled:'-'}社</span></div>
      <div class="tut-summary-row"><span>影響国家</span><span class="mono">${meta?meta.countriesInfluenced:'-'}ヶ国</span></div>
      <div class="tut-summary-row"><span>国家崩壊</span><span class="mono">${meta?meta.countriesCollapsed:'-'}ヶ国</span></div>
      <div class="tut-summary-row"><span>プレイ時間</span><span class="mono">${meta?formatPlayTime(meta.playTimeSeconds):'-'}</span></div>
    </div>
    <div class="tut-actions">
      <button class="btn primary" id="boot-continue" style="padding:13px 34px;">CONTINUE</button>
      <button class="btn ghost" id="boot-newworld" style="padding:11px 28px;">NEW WORLD</button>
    </div>
  `;
}
function slotPickerHtml(allSlots, title){
  return `
    <div class="tut-badge">${title||'NEW WORLD'}</div>
    <div class="tut-lines"><div class="tut-line small">スロットを選んでください。既存の世界を選ぶと上書きされます。</div></div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;margin-top:12px;">
    ${allSlots.map(s=>`
      <button class="btn ${s.meta?'ghost':'primary'} block" data-slot-pick="${s.slot}" style="text-align:left;padding:14px;">
        <div style="font-weight:700;">WORLD ${String(s.slot).padStart(2,'0')}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:3px;">${s.meta? `${s.meta.dateText} ・ ${fmtYen(s.meta.netWorth)}（上書きされます）` : '空きスロット'}</div>
      </button>
    `).join('')}
    </div>
    <button class="tut-skip" id="boot-back" style="margin-top:16px;">戻る</button>
  `;
}
function showBootChoiceScreen(activeSlotNum, allSlots){
  const overlay=document.getElementById('boot-screen');
  overlay.style.display='flex';
  function renderContinueView(){
    overlay.innerHTML=`<div class="tut-wrap">${bootScreenHtml(activeSlotNum, allSlots)}</div>`;
    document.getElementById('boot-continue').addEventListener('click', async ()=>{
      const r=await loadSlot(activeSlotNum);
      if(r.ok){
        if(r.restoredFromBackup) toast('セーブデータに問題があったため、バックアップから復元しました');
        recalcWorldPower();
      } else {
        toast('セーブデータの読み込みに失敗しました。新しい世界を開始します');
        await startNewWorldInSlot(activeSlotNum);
      }
      overlay.style.display='none';
      await initApp();
    });
    document.getElementById('boot-newworld').addEventListener('click', renderPickerView);
  }
  function renderPickerView(){
    overlay.innerHTML=`<div class="tut-wrap">${slotPickerHtml(allSlots)}</div>`;
    overlay.querySelectorAll('[data-slot-pick]').forEach(b=>b.addEventListener('click', async ()=>{
      const n=parseInt(b.dataset.slotPick,10);
      const info=allSlots.find(s=>s.slot===n);
      if(info && info.meta){
        if(!confirm(`WORLD ${String(n).padStart(2,'0')} を上書きします。よろしいですか？`)) return;
      }
      await startNewWorldInSlot(n);
      overlay.style.display='none';
      await initApp();
    }));
    document.getElementById('boot-back').addEventListener('click', renderContinueView);
  }
  renderContinueView();
}
function startBackgroundTimers(){
  setInterval(()=>{ if(G && G.player){ G.player.playTimeSeconds=(G.player.playTimeSeconds||0)+5; } }, 5000);
  setInterval(()=>{ if(G) saveGame(); }, 60000);
  window.addEventListener('beforeunload',()=>{ if(G) saveGame(); });
}
async function initApp(){
  document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));
  document.getElementById('modal-backdrop').addEventListener('click',closeModal);
  document.getElementById('modal-close-btn').addEventListener('click',closeModal);
  document.getElementById('btn-settings').addEventListener('click',openSettingsModal);
  if(G.tutorial && G.tutorial.active){
    const step=tutorialCurrentStep();
    if(step && step.targetScreen) switchScreen(step.targetScreen);
  }
  renderAll();
  startBackgroundTimers();
}
boot();

})();
</script>
