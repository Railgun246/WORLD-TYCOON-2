<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WORLD TYCOON — 世界経済支配シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D13;
  --bg2:#0E121A;
  --panel:#131A24;
  --panel2:#1A2230;
  --border:#232C3B;
  --text:#E7ECF3;
  --muted:#8592A6;
  --dim:#5C6980;
  --gold:#E8B84B;
  --gold-dim:#8A6E2E;
  --teal:#3FD9C7;
  --red:#F0685C;
  --purple:#9C8CF0;
  --blue:#6FA8F5;
  --radius:10px;
  --font-d:'Space Grotesk','Noto Sans JP',sans-serif;
  --font-b:'Noto Sans JP',sans-serif;
  --font-m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-b);}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(63,217,199,0.06), transparent 40%),
    radial-gradient(circle at 85% 10%, rgba(232,184,75,0.05), transparent 45%),
    var(--bg);
  min-height:100vh;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:66px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
.mono{font-family:var(--font-m);}
.muted{color:var(--muted);}
.dim{color:var(--dim);}
.gold{color:var(--gold);}
.teal{color:var(--teal);}
.red{color:var(--red);}
.purple{color:var(--purple);}
.blue{color:var(--blue);}

/* ---- header ---- */
#topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, rgba(10,13,19,0.97), rgba(10,13,19,0.9));
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:10px 14px 8px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{
  width:26px;height:26px;border-radius:6px;
  background:conic-gradient(from 200deg, var(--gold), var(--teal), var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-weight:700;font-size:12px;color:#0A0D13;
  flex-shrink:0;
}
.brand-text{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:0.5px;}
.brand-sub{font-size:9px;color:var(--dim);letter-spacing:1.5px;margin-top:-2px;}
.icon-btn{
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;
}
.stat-strip{display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:2px;}
.stat-chip{
  flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;min-width:88px;
}
.stat-chip .lbl{font-size:9px;color:var(--dim);letter-spacing:0.5px;margin-bottom:2px;}
.stat-chip .val{font-family:var(--font-m);font-size:13px;font-weight:600;}

/* ---- content ---- */
#content{flex:1;padding:14px;padding-bottom:20px;}
.screen{display:none;animation:fade .25s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
}
.panel-title{
  font-family:var(--font-d);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.section-label{font-family:var(--font-d);font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:18px 0 8px;}

/* ---- world power gauge (signature element) ---- */
.gauge-wrap{display:flex;align-items:center;gap:16px;}
.gauge-num{font-family:var(--font-m);font-size:26px;font-weight:600;}
.gauge-desc{font-size:11px;color:var(--muted);line-height:1.5;}

/* ---- network world view ---- */
#worldnet{width:100%;height:auto;display:block;}
.node-label{font-size:7px;font-family:var(--font-m);fill:var(--dim);}

/* ---- lists ---- */
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.row-main{flex:1;min-width:0;}
.row-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-sub{font-size:10.5px;color:var(--dim);margin-top:2px;}
.row-right{text-align:right;flex-shrink:0;padding-left:8px;}
.row-val{font-family:var(--font-m);font-size:13px;font-weight:600;}
.row-delta{font-family:var(--font-m);font-size:10.5px;margin-top:2px;}
.up{color:var(--teal);}
.down{color:var(--red);}
.flat{color:var(--dim);}

.tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:20px;border:1px solid var(--border);color:var(--muted);margin-right:4px;}
.tag.owned{color:var(--gold);border-color:var(--gold-dim);background:rgba(232,184,75,0.08);}
.tag.control{color:var(--teal);border-color:#1f5b52;background:rgba(63,217,199,0.08);}
.tag.warn{color:var(--red);border-color:#5a2a26;background:rgba(240,104,92,0.08);}
.tag.info{color:var(--blue);border-color:#28456f;background:rgba(111,168,245,0.08);}

.pillbar{width:100%;height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:5px;}
.pillbar > div{height:100%;border-radius:4px;}

/* ---- nav ---- */
#navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(14,18,26,0.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--border);
  display:flex;justify-content:center;
}
#navbar-inner{max-width:520px;width:100%;display:flex;}
.navbtn{
  flex:1;background:none;border:none;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;font-size:9px;letter-spacing:0.3px;
}
.navbtn .ic{font-size:16px;}
.navbtn.active{color:var(--gold);}

/* ---- buttons ---- */
.btn{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:10px 14px;border-radius:8px;font-size:12.5px;font-weight:500;
}
.btn.primary{background:linear-gradient(135deg,var(--gold),#c99a3a);color:#171003;border:none;font-weight:700;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn.danger{background:rgba(240,104,92,0.12);border:1px solid #5a2a26;color:var(--red);}
.btn.block{width:100%;}
.btn:disabled{opacity:0.4;}
.btn-row{display:flex;gap:8px;}
.btn-sm{padding:6px 10px;font-size:11px;border-radius:7px;}

.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip-select.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;}
.chip-select button{
  background:var(--panel2);border:1px solid var(--border);color:var(--muted);
  padding:6px 11px;border-radius:20px;font-size:11px;flex-shrink:0;white-space:nowrap;
}
.chip-select button.active{background:var(--gold);color:#171003;border-color:var(--gold);font-weight:700;}

input[type=number], input[type=text], select{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:9px 10px;border-radius:8px;font-family:var(--font-m);font-size:13px;width:100%;
}
input[type=range]{width:100%;}
label.field-label{font-size:10.5px;color:var(--dim);letter-spacing:0.5px;margin-bottom:4px;display:block;}

/* ---- modal ---- */
#modal-layer{position:fixed;inset:0;z-index:50;display:none;}
#modal-layer.open{display:block;}
#modal-backdrop{position:absolute;inset:0;background:rgba(4,6,10,0.7);backdrop-filter:blur(2px);}
#modal-sheet{
  position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  background:var(--bg2);border:1px solid var(--border);border-bottom:none;
  border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;padding:16px 16px 24px;
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 12px;}
.modal-close{position:absolute;right:14px;top:14px;background:var(--panel);border:1px solid var(--border);width:28px;height:28px;border-radius:8px;color:var(--muted);}

/* ---- news / sns / voices ---- */
.feed-item{padding:11px 0;border-bottom:1px solid var(--border);}
.feed-item:last-child{border-bottom:none;}
.feed-time{font-size:9.5px;color:var(--dim);font-family:var(--font-m);}
.feed-head{font-size:12.5px;font-weight:700;margin:3px 0 3px;}
.feed-body{font-size:12px;color:var(--muted);line-height:1.55;}
.sns-item{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border);}
.sns-item:last-child{border-bottom:none;}
.sns-avatar{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.sns-name{font-size:11.5px;font-weight:600;}
.sns-handle{font-size:10px;color:var(--dim);}
.sns-text{font-size:12px;color:var(--text);margin-top:3px;line-height:1.5;}
.voice-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.voice-role{font-size:10px;color:var(--gold);letter-spacing:0.5px;margin-bottom:4px;font-weight:700;}
.voice-text{font-size:12.5px;line-height:1.55;}
.loading-dots{color:var(--dim);font-size:12px;}
.empty-state{text-align:center;padding:30px 10px;color:var(--dim);font-size:12px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.metric-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;}
.metric-box .lbl{font-size:9.5px;color:var(--dim);}
.metric-box .val{font-family:var(--font-m);font-size:14px;font-weight:600;margin-top:2px;}

.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:20px;font-size:12px;z-index:60;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center;
}
.toast.show{opacity:1;}
hr.sep{border:none;border-top:1px solid var(--border);margin:12px 0;}
.search-bar{margin-bottom:10px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}

/* ---- candlestick chart ---- */
.chart-wrap{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;}
.candle-up{fill:var(--teal);stroke:var(--teal);}
.candle-down{fill:var(--red);stroke:var(--red);}
.vol-up{fill:rgba(63,217,199,0.5);}
.vol-down{fill:rgba(240,104,92,0.5);}
.chart-axis-label{font-family:var(--font-m);font-size:8px;fill:var(--dim);}

/* ---- timeline ---- */
.tl-year{font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--gold);margin:14px 0 6px;}
.tl-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.tl-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);margin-top:5px;flex-shrink:0;}
.tl-text{font-size:12px;line-height:1.5;}

/* ---- badges ---- */
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}

/* ---- tutorial ---- */
#tutorial-banner{
  margin-top:10px;border-radius:10px;padding:11px 12px;
  background:linear-gradient(135deg, rgba(232,184,75,0.16), rgba(63,217,199,0.07));
  border:1px solid var(--gold-dim);display:flex;flex-direction:column;gap:6px;
}
.tut-step-label{font-family:var(--font-d);font-size:9.5px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;}
.tut-instruction{font-size:12.5px;line-height:1.5;color:var(--text);}
.tut-banner-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#tutorial-overlay{
  position:fixed;inset:0;z-index:90;
  background:radial-gradient(circle at 50% 30%, rgba(20,26,36,0.98), rgba(4,5,8,0.99));
  display:flex;flex-direction:column;align-items:center;
  padding:56px 26px;text-align:center;
  overflow-y:auto;
}
.tut-wrap{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;}
.tut-lines{max-width:440px;}
.tut-line{font-size:16px;line-height:1.9;color:var(--text);margin-bottom:2px;animation:tutfade .5s ease both;font-family:var(--font-d);font-weight:500;}
.tut-line.small{font-size:13px;color:var(--muted);font-family:var(--font-b);font-weight:400;line-height:1.7;}
@keyframes tutfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.tut-badge{font-family:var(--font-m);font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:18px;text-transform:uppercase;}
.tut-actions{margin-top:26px;display:flex;flex-direction:column;gap:10px;align-items:center;}
.tut-skip{background:none;border:none;color:var(--dim);font-size:11px;text-decoration:underline;padding:6px;}
.tut-summary-table{width:100%;max-width:440px;margin:18px 0;text-align:left;}
.tut-summary-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
#boot-screen{
  position:fixed;inset:0;z-index:99;
  background:radial-gradient(circle at 50% 30%, rgba(20,26,36,0.99), rgba(4,5,8,1));
  display:flex;flex-direction:column;align-items:center;
  padding:56px 26px;text-align:center;overflow-y:auto;
}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">GC</div>
        <div>
          <div class="brand-text">WORLD TYCOON</div>
          <div class="brand-sub">GLOBAL CAPITAL — 神視点経済シミュレーター</div>
        </div>
      </div>
      <button class="icon-btn" id="btn-settings">⚙</button>
    </div>
    <div class="stat-strip" id="stat-strip"></div>
    <div id="tutorial-banner" style="display:none;"></div>
  </div>

  <div id="content">
    <div class="screen active" id="screen-world"></div>
    <div class="screen" id="screen-market"></div>
    <div class="screen" id="screen-business"></div>
    <div class="screen" id="screen-assets"></div>
    <div class="screen" id="screen-mna"></div>
    <div class="screen" id="screen-news"></div>
    <div class="screen" id="screen-people"></div>
    <div class="screen" id="screen-sns"></div>
  </div>

  <div id="navbar"><div id="navbar-inner">
    <button class="navbtn active" data-screen="world"><span class="ic">🌎</span>世界</button>
    <button class="navbtn" data-screen="market"><span class="ic">📈</span>市場</button>
    <button class="navbtn" data-screen="business"><span class="ic">🏢</span>事業</button>
    <button class="navbtn" data-screen="assets"><span class="ic">💰</span>資産</button>
    <button class="navbtn" data-screen="mna"><span class="ic">🏦</span>買収</button>
    <button class="navbtn" data-screen="news"><span class="ic">📰</span>ニュース</button>
    <button class="navbtn" data-screen="people"><span class="ic">👥</span>国民</button>
    <button class="navbtn" data-screen="sns"><span class="ic">📱</span>SNS</button>
  </div></div>

  <div id="modal-layer">
    <div id="modal-backdrop"></div>
    <div id="modal-sheet">
      <div class="modal-handle"></div>
      <button class="modal-close" id="modal-close-btn">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="tutorial-overlay" style="display:none;"></div>
  <div id="boot-screen" style="display:none;"></div>
</div>

<script>
(function(){
"use strict";

/* =========================================================================
   0. UTILITIES
   ========================================================================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=(()=>{let n=0;return p=>`${p}_${Date.now().toString(36)}${(++n).toString(36)}`;})();
function normRand(){
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function fmtNum(n,d=1){
  if(n===undefined||n===null||isNaN(n)) return "0";
  return Math.abs(n)>=1000 ? n.toLocaleString('ja-JP',{maximumFractionDigits:0}) : n.toLocaleString('ja-JP',{maximumFractionDigits:d});
}
function fmtYen(trillion){
  if(trillion===undefined||trillion===null||isNaN(trillion)) trillion=0;
  const sign=trillion<0?"-":""; trillion=Math.abs(trillion);
  if(trillion>=10000) return sign+fmtNum(trillion/10000,2)+"京円";
  if(trillion<0.01 && trillion!==0) return sign+fmtNum(trillion*10000,1)+"億円";
  if(trillion<1) return sign+fmtNum(trillion*10000,0)+"億円";
  return sign+fmtNum(trillion,2)+"兆円";
}
function fmtPct(n,d=1){ if(isNaN(n))n=0; return (n>0?"+":"")+n.toFixed(d)+"%"; }
function deltaClass(n){ return n>0.001?"up":n<-0.001?"down":"flat"; }
function fmtPrice(p){ return "¥"+fmtNum(Math.round(p),0); }
function escapeHtml(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900);
}

/* =========================================================================
   1. DATA SEEDS
   ========================================================================= */
const MAJOR_COUNTRIES=[
 ["日本","🇯🇵",600,1.0,2.5,1.0,2.4,12400,["IT","半導体","自動車","医療","AI"]],
 ["アメリカ","🇺🇸",2900,2.2,3.0,4.5,4.0,34000,["IT","金融","AI","エネルギー","軍需","宇宙"]],
 ["中国","🇨🇳",2200,4.5,1.5,3.0,5.2,141000,["製造","半導体","自動車","建設","AI"]],
 ["韓国","🇰🇷",220,1.8,2.2,3.0,3.0,5200,["半導体","自動車","IT","造船"]],
 ["台湾","🇹🇼",90,3.0,1.8,1.8,3.4,2400,["半導体","IT","精密機械"]],
 ["インド","🇮🇳",480,6.5,4.8,6.0,7.5,143000,["IT","製薬","自動車","農業"]],
 ["イギリス","🇬🇧",380,1.2,3.2,4.75,4.2,6800,["金融","医療","エネルギー","軍需"]],
 ["ドイツ","🇩🇪",480,0.8,2.8,3.5,5.8,8400,["自動車","製造","エネルギー","化学"]],
 ["フランス","🇫🇷",340,1.1,2.4,3.5,7.2,6800,["宇宙","エネルギー","金融","ラグジュアリー"]],
 ["イタリア","🇮🇹",250,0.7,2.1,3.5,7.8,5900,["製造","ラグジュアリー","自動車","観光"]],
 ["カナダ","🇨🇦",260,1.6,2.6,3.75,5.9,3900,["エネルギー","鉱業","金融","農業"]],
 ["オーストラリア","🇦🇺",210,2.0,3.0,4.1,4.0,2700,["鉱業","農業","金融","エネルギー"]],
 ["ブラジル","🇧🇷",250,2.3,4.5,10.5,7.8,21600,["農業","鉱業","エネルギー","製造"]],

function migrateState(s){
  const fromVersion=s.version||1;
  s.version=CURRENT_SAVE_VERSION;
  s.resources=s.resources&&s.resources.length? s.resources : RESOURCES.map(r=>({id:r.id,name:r.name,unit:r.unit,base:r.base,price:r.base,vol:r.vol}));
  s.realEstateListings=s.realEstateListings||[];
  s.contracts=s.contracts||[];
  s.chainQueue=s.chainQueue||[];
  s.history=s.history||[];
  s.news=s.news||[]; s.sns=s.sns||[]; s.voiceLog=s.voiceLog||{}; s.voiceViewCache=s.voiceViewCache||{};
  s.uiWorldTab=s.uiWorldTab||"overview"; s.uiBizTab=s.uiBizTab||"holdings"; s.uiMnaTab=s.uiMnaTab||"company"; s.uiChartTf=s.uiChartTf||"day";
  s.uiInfraCountry=s.uiInfraCountry||null; s.uiResResource=s.uiResResource||"oil"; s.uiResCountry=s.uiResCountry||null;
  s.uiFoundCountry=s.uiFoundCountry||null; s.uiFoundSector=s.uiFoundSector||"AI"; s.uiFoundTier=s.uiFoundTier||"small";
  const p=s.player;
  p.realEstate=p.realEstate||[]; p.plants=p.plants||[]; p.bank=p.bank||null; p.patents=p.patents||[]; p.resourceHoldings=p.resourceHoldings||[];
  p.impact=p.impact||{totalInvested:0,jobsCreated:0,jobsLost:0,crisesTriggered:0,nationsCollapsed:0,nationsSaved:0,companiesFounded:0};
  p.milestones=p.milestones||{power:[]};
  p.recentActions=p.recentActions||[];
  if(p.playTimeSeconds===undefined) p.playTimeSeconds=0;
  // migrate holdings from old plain-number format {coId:number} to {coId:{shares,costBasis}}
  Object.keys(p.holdings||{}).forEach(coId=>{
    const v=p.holdings[coId];
    if(typeof v==='number'){
      const co=s.companies.find(c=>c.id===coId);
      const price=co?co.price:0;
      p.holdings[coId]={shares:v, costBasis:(v*price)/1e12};
    } else if(v && typeof v==='object'){
      if(v.shares===undefined) v.shares=0;
      if(v.costBasis===undefined) v.costBasis=(v.shares*(s.companies.find(c=>c.id===coId)?.price||0))/1e12;
    }
  });
  s.tutorial=s.tutorial||{active:false,step:0,flags:{},novaId:null,struggleId:null,skipped:false,completed:false,startSnapshot:null};
  s.countries.forEach(c=>{
    if(c.stability===undefined) c.stability=clamp(100-(c.unrest||20)*0.6-(c.poverty||15)*0.3,10,90);
    if(c.tension===undefined) c.tension=rand(5,25);
    if(c.collapsed===undefined) c.collapsed=false;
    if(c.collapseRemaining===undefined) c.collapseRemaining=0;
    if(c.conflict===undefined) c.conflict=null;
    if(c.infraInvested===undefined) c.infraInvested=0;
    if(c.regulatedUntil===undefined) c.regulatedUntil=0;
    if(c._lastShareFlag===undefined) c._lastShareFlag=0;
    if(c._lastInfluenceFlag===undefined) c._lastInfluenceFlag=0;
    if(!c.influence) c.influence={total:0,econ:0,corp:0,media:0,policy:0};
    if(c._policyScore===undefined) c._policyScore=0;
    if(!c.politician) c.politician=makePolitician(c.name);
    if(!c.resourceMod) c.resourceMod=buildResourceMod(c.name);
    if(c.rivalId===undefined){ const rn=RIVAL_MAP[c.name]; const r=rn?s.countries.find(x=>x.name===rn):null; c.rivalId=r?r.id:null; }
  });
  s.companies.forEach(co=>{
    if(!co.candles) co.candles=[];
    if(co._todayVolumeShares===undefined) co._todayVolumeShares=0;
    if(co.founder===undefined) co.founder=false;
    if(co.patented===undefined) co.patented=false;
  });
  if(s.realEstateListings.length===0){
    s.countries.filter(c=>c.major).forEach(country=>{ for(let i=0;i<2;i++) s.realEstateListings.push(makeListing(country)); });
  }
  if(fromVersion<CURRENT_SAVE_VERSION){
    console.log(`save data migrated: v${fromVersion} -> v${CURRENT_SAVE_VERSION}`);
  }
  return s;
}

function hShares(coId){ const h=G.player.holdings[coId]; return h?(h.shares||0):0; }
function hCostBasis(coId){ const h=G.player.holdings[coId]; return h?(h.costBasis||0):0; }
function addHolding(coId, shares, cost){
  const h=G.player.holdings[coId]||{shares:0,costBasis:0};
  h.shares+=shares; h.costBasis+=cost;
  G.player.holdings[coId]=h;
}
function reduceHolding(coId, shares){
  const h=G.player.holdings[coId]; if(!h||h.shares<=0) return 0;
  const origShares=h.shares;
  const portion=clamp(shares/origShares,0,1);
  const removedCost=h.costBasis*portion;
  h.shares=Math.max(0,h.shares-shares);
  h.costBasis=Math.max(0,h.costBasis-removedCost);
  if(h.shares<=0){ h.shares=0; h.costBasis=0; }
  return removedCost;
}

function recalcWorldPower(){
  const p=G.player;
  let controlled=0, ownedValue=0, countriesTouched=new Set();
  G.companies.forEach(co=>{
    const sh=hShares(co.id);
    if(sh>0){
      const val=sh*co.price/1e12;
      ownedValue+=val;
      countriesTouched.add(co.country);
      const pct=sh/co.shares;
      if(pct>=0.5) controlled+=val;
    }
  });
  const totalMarket = G.companies.reduce((a,c)=>a+c.marketCap,0);
  const otherAssets = (p.realEstate.reduce((a,r)=>a+r.landValue,0)) + (p.plants.reduce((a,pl)=>a+pl.cost,0)) + (p.bank?p.bank.capital:0);
  const finInfluence = clamp((ownedValue/Math.max(totalMarket,1))*400,0,100);
  const corpInfluence = clamp((controlled/Math.max(totalMarket,1))*600,0,100);
  const polInfluence = clamp(countriesTouched.size*3.2 + G.countries.filter(c=>(c.infraInvested||0)>0).length*3,0,100);
  const techInfluence = clamp(G.companies.filter(c=>hShares(c.id)>0 && (c.sector==="AI"||c.sector==="半導体"||c.sector==="IT")).length*6 + p.patents.length*8,0,100);
  const infoInfluence = clamp((p.recentActions.length)*4 + G.companies.filter(c=>c.sector==="メディア"&&hShares(c.id)>0).length*10,0,100);
  const resInfluence = clamp(G.companies.filter(c=>hShares(c.id)>0 && (c.sector==="エネルギー"||c.sector==="鉱業")).length*7 + p.plants.length*6 + p.resourceHoldings.length*3,0,100);
  const power = (finInfluence*0.26+corpInfluence*0.26+polInfluence*0.16+techInfluence*0.12+infoInfluence*0.08+resInfluence*0.12);
  p.worldPower=Math.round(power);
  p._powerBreakdown={finInfluence,corpInfluence,polInfluence,techInfluence,infoInfluence,resInfluence};
  [25,50,75,90].forEach(t=>{
    if(p.worldPower>=t && !p.milestones.power.includes(t)){
      p.milestones.power.push(t);
      addHistory(`GLOBAL CAPITALのWORLD POWERが${t}に到達した。`);
    }
  });
  return p.worldPower;
}

function netWorth(){
  const p=G.player;
  let v=p.cash;
  G.companies.forEach(co=>{ const sh=hShares(co.id); if(sh>0) v+=sh*co.price/1e12; });
  p.realEstate.forEach(r=>v+=r.landValue);
  p.plants.forEach(pl=>v+=pl.cost*0.85);
  p.resourceHoldings.forEach(h=>{ const r=G.resources.find(x=>x.id===h.resource); if(r) v+=(h.units*r.price)/1e6; });
  if(p.bank) v+=p.bank.capital;
  p.patents.forEach(pt=>v+=pt.value);
  return v;
}

function ownershipPct(co){ return (hShares(co.id)/co.shares)*100; }

/* =========================================================================
   3. PERSISTENCE
   Storage backend: this environment provides `window.storage` (an async
   key/value JSON store, persistent per-user across sessions) as the
   supported persistence API for Claude.ai artifacts — browser storage APIs
   such as localStorage/IndexedDB are not available here. The functions
   below are written as a thin adapter layer (storageGet/Set/Delete/List)
   so the backend could be swapped (e.g. for IndexedDB in a non-artifact
   deployment) without touching the save/slot/backup logic built on top.
   ========================================================================= */
const CURRENT_SAVE_VERSION=3;
const SAVE_KEY="wt_save_v2";       // legacy single-slot key (pre-slot system)
const SAVE_KEY_OLD="wt_save_v1";   // legacy pre-holdings-refactor key
const ACTIVE_SLOT_KEY="wt_active_slot";
const SLOT_COUNT=3;
function slotDataKey(n){ return `wt_slot_${n}_data`; }
function slotMetaKey(n){ return `wt_slot_${n}_meta`; }
function slotBackupKey(n,i){ return `wt_slot_${n}_backup${i}`; }

async function storageGet(key){
  try{ const r=await window.storage.get(key,false); return (r&&r.value!==undefined)?r.value:null; }
  catch(e){ return null; }
}
async function storageSet(key,value){
  try{ const r=await window.storage.set(key,value,false); return !!r; }
  catch(e){ console.error('storage set failed',key,e); return false; }
}
async function storageDelete(key){
  try{ await window.storage.delete(key,false); return true; }
  catch(e){ return false; }
}

/* ---- integrity ---- */
function validateStateShape(s){
  if(!s || typeof s!=='object') return false;
  if(!Array.isArray(s.countries) || !s.countries.length) return false;
  if(!Array.isArray(s.companies) || !s.companies.length) return false;
  if(!s.player || typeof s.player!=='object') return false;
  if(typeof s.day!=='number' || isNaN(s.day)) return false;
  return true;
}
function runIntegrityCheck(){
  const issues=[];
  if(!G){ issues.push('ゲーム状態が存在しません'); return {ok:false,issues}; }
  G.companies.forEach(co=>{
    const sh=hShares(co.id);
    if(sh>co.shares) issues.push(`${co.name}: 保有株数が発行済株式数を超過`);
    if(sh<0) issues.push(`${co.name}: 保有株数が負の値`);
    if(isNaN(co.price)||co.price<=0) issues.push(`${co.name}: 株価が不正 (${co.price})`);
    if(isNaN(co.marketCap)) issues.push(`${co.name}: 時価総額が不正`);
  });
  if(isNaN(G.player.cash)) issues.push('現金が不正な値です');
  if(G.player.cash<0) issues.push('現金がマイナスです');
  G.countries.forEach(c=>{
    if(isNaN(c.gdp)||c.gdp<=0) issues.push(`${c.name}: GDPが不正`);
    if(c.stability<0||c.stability>100) issues.push(`${c.name}: 安定度が範囲外`);
  });
  return {ok:issues.length===0, issues};
}

/* ---- calendar date ---- */
const GAME_START_YEAR=2026;
const MONTH_DAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
function formatGameDate(day){
  let y=GAME_START_YEAR, remaining=Math.floor(day);
  while(true){
    const yearLen=365;
    if(remaining<yearLen) break;
    remaining-=yearLen; y++;
  }
  let m=0;
  while(remaining>=MONTH_DAYS[m]){ remaining-=MONTH_DAYS[m]; m++; }
  const d=remaining+1;
  return {year:y, month:m+1, day:d, text:`${y}年${m+1}月${d}日`};
}

/* ---- slot metadata ---- */
function computeSlotMeta(state){
  const controlled=state.companies.filter(co=>{
    const h=state.player.holdings[co.id];
    return h && h.shares && (h.shares/co.shares)>=0.5;
  }).length;
  const influenced=state.countries.filter(c=>c.influence && c.influence.total>=25).length;
  const collapsedCount=state.countries.filter(c=>c.collapsed).length;
  const nw=(()=>{
    let v=state.player.cash;
    state.companies.forEach(co=>{ const h=state.player.holdings[co.id]; if(h&&h.shares>0) v+=h.shares*co.price/1e12; });
    (state.player.realEstate||[]).forEach(r=>v+=r.landValue);
    return v;
  })();
  const dateInfo=formatGameDate(state.day);
  return {
    savedAt:Date.now(), day:state.day, dateText:dateInfo.text,
    cash:state.player.cash, netWorth:nw,
    companiesControlled:controlled, countriesInfluenced:influenced, countriesCollapsed:collapsedCount,
    playTimeSeconds:(state.player.playTimeSeconds||0),
    saveVersion:CURRENT_SAVE_VERSION,
  };
}

/* ---- core save/load ---- */
let currentSlot=1;
let saveInFlight=false;
let lastBackupRotateAt=0;
let pendingForceBackup=false;
const BACKUP_ROTATE_INTERVAL_MS=90000; // rotate backups at most every 90s of real time, to avoid
                                        // excessive storage I/O on every single trade while still
                                        // keeping recent recovery points.
async function saveGame(opts){
  if(!G) return;
  if(saveInFlight){ return; }
  saveInFlight=true;
  try{
    const n=currentSlot;
    const json=JSON.stringify(G);
    const forceBackup = (opts && opts.forceBackup) || pendingForceBackup;
    pendingForceBackup=false;
    const now=Date.now();
    if(forceBackup || (now-lastBackupRotateAt)>BACKUP_ROTATE_INTERVAL_MS){
      const prevCurrent=await storageGet(slotDataKey(n));
      if(prevCurrent){
        const b2=await storageGet(slotBackupKey(n,1));
        if(b2!==null) await storageSet(slotBackupKey(n,2), b2);
        await storageSet(slotBackupKey(n,1), prevCurrent);
      }
      lastBackupRotateAt=now;
    }
    await storageSet(slotDataKey(n), json);
    await storageSet(slotMetaKey(n), JSON.stringify(computeSlotMeta(G)));
    await storageSet(ACTIVE_SLOT_KEY, String(n));
  }catch(e){ console.error('save failed',e); }
  finally{ saveInFlight=false; }
}
async function loadSlot(n){
  const raw=await storageGet(slotDataKey(n));
  if(raw){
    try{
      const parsed=JSON.parse(raw);
      if(validateStateShape(parsed)){ G=migrateState(parsed); currentSlot=n; return {ok:true}; }
    }catch(e){ /* fall through to backups */ }
  }
  // corrupted or missing — try backups in order
  for(let i=1;i<=3;i++){
    const braw=await storageGet(slotBackupKey(n,i));
    if(!braw) continue;
    try{
      const parsed=JSON.parse(braw);
      if(validateStateShape(parsed)){
        G=migrateState(parsed); currentSlot=n;
        await storageSet(slotDataKey(n), braw); // restore corrupted slot from backup
        return {ok:true, restoredFromBackup:i};
      }
    }catch(e){ /* try next backup */ }
  }
  return {ok:false};
}
async function listSaveSlots(){
  const slots=[];
  for(let n=1;n<=SLOT_COUNT;n++){
    const metaRaw=await storageGet(slotMetaKey(n));
    if(metaRaw){
      try{ slots.push({slot:n, meta:JSON.parse(metaRaw)}); continue; }catch(e){}
    }
    const dataRaw=await storageGet(slotDataKey(n));
    if(dataRaw){
      try{ const parsed=JSON.parse(dataRaw); slots.push({slot:n, meta:computeSlotMeta(parsed)}); continue; }catch(e){}
    }
    slots.push({slot:n, meta:null});
  }
  return slots;
}
async function deleteSlot(n){
  await storageDelete(slotDataKey(n));
  await storageDelete(slotMetaKey(n));
  for(let i=1;i<=3;i++) await storageDelete(slotBackupKey(n,i));
}
async function migrateLegacySaveIfNeeded(){
  // if pre-slot-system save exists and no slot data yet, adopt it as slot 1
  const existingSlot1=await storageGet(slotDataKey(1));
  if(existingSlot1) return;
  const legacy=await storageGet(SAVE_KEY) || await storageGet(SAVE_KEY_OLD);
  if(!legacy) return;
  try{
    const parsed=JSON.parse(legacy);
    if(validateStateShape(parsed)){
      await storageSet(slotDataKey(1), legacy);
      const migrated=migrateState(JSON.parse(legacy));
      await storageSet(slotMetaKey(1), JSON.stringify(computeSlotMeta(migrated)));
    }
  }catch(e){ /* ignore unreadable legacy save */ }
}
async function resetGame(){
  await deleteSlot(currentSlot);
  G=initWorld();
  recalcWorldPower();
  startTutorial();
  await saveGame();
  renderAll();
  toast("ゲームをリセットしました");
}
async function startNewWorldInSlot(n){
  currentSlot=n;
  G=initWorld();
  recalcWorldPower();
  startTutorial();
  await saveGame();
}

/* =========================================================================
   4. EVENT CHAIN ENGINE
   ========================================================================= */
function scheduleChain(day,type,payload){
  G.chainQueue.push(Object.assign({id:uid('ch'),day,type},payload));
}
function processChainQueue(){
  if(!G.chainQueue.length) return;
  const due=G.chainQueue.filter(c=>c.day<=G.day);
  if(!due.length) return;
  due.forEach(applyChainEffect);
  G.chainQueue=G.chainQueue.filter(c=>c.day>G.day);
}
function applyChainEffect(item){
  switch(item.type){
    case 'oil_up':
      G.macro.oilPrice=clamp(G.macro.oilPrice+item.delta,20,400);
      if(item.head) pushNews(item.head,item.body,'world',false);
      break;
    case 'inflation_up':
      G.countries.forEach(c=>{ if(!c.collapsed) c.inflation=clamp(c.inflation+item.delta,-2,60); });
      if(item.head) pushNews(item.head,item.body,'world',false);
      break;
    case 'sentiment_down':
      G.macro.globalSentiment=clamp(G.macro.globalSentiment-item.delta,-100,100);
      if(item.head) pushNews(item.head,item.body,'market',false);
      break;
    case 'sentiment_up':
      G.macro.globalSentiment=clamp(G.macro.globalSentiment+item.delta,-100,100);
      if(item.head) pushNews(item.head,item.body,'market',false);
      break;
    case 'unemployment_up':
      G.countries.forEach(c=>{ if(!c.collapsed) c.unemployment=clamp(c.unemployment+item.delta,0.5,50); });
      if(item.head) pushNews(item.head,item.body,'world',false);
      break;
    case 'unrest_up':
      G.countries.forEach(c=>{ if(!c.collapsed){ c.unrest=clamp(c.unrest+item.delta,0,100); c.govSupport=clamp(c.govSupport-item.delta,0,100);} });
      if(item.head) pushNews(item.head,item.body,'world',false);
      break;
    case 'regulation_start':{
      const c=G.countries.find(x=>x.id===item.countryId);
      if(c) c.regulatedUntil=G.day+60;
      if(item.head) pushNews(item.head,item.body,'mna',true);
      break;
    }
    case 'infra_boost':{
      const c=G.countries.find(x=>x.id===item.countryId);
      if(c && !c.collapsed){
        c.happiness=clamp(c.happiness+item.delta,0,100);
        c.growthTendency=clamp(c.growthTendency+item.delta2,-5,12);
        c.unemployment=clamp(c.unemployment-item.delta3,0.5,50);
        c.govSupport=clamp(c.govSupport+item.delta4,0,100);
      }
      if(item.head) pushNews(item.head,item.body,'world',false);
      break;
    }
    case 'tension_up':{
      const c=G.countries.find(x=>x.id===item.countryId);
      if(c) c.tension=clamp((c.tension||0)+item.delta,0,100);
      if(item.head) pushNews(item.head,item.body,'world',false);
      break;
    }
    case 'crisis_boost':
      G.macro.bubbleRisk=clamp(G.macro.bubbleRisk+item.delta,0,100);
      break;
    case 'news_only':
      pushNews(item.head,item.body,item.tag||'world',!!item.breaking);
      break;
  }
}

function checkMonopolyAndTrigger(country){
  if(!country) return;
  const compsInCountry=G.companies.filter(c=>c.country===country.id);
  const totalCap=compsInCountry.reduce((a,c)=>a+c.marketCap,0);
  const ownedCap=compsInCountry.reduce((a,c)=>a+(hShares(c.id)/c.shares)*c.marketCap,0);
  const share=totalCap>0?ownedCap/totalCap:0;
  const thresholds=[0.25,0.4,0.6];
  thresholds.forEach(t=>{
    if(share>=t && country._lastShareFlag<t){
      country._lastShareFlag=t;
      scheduleChain(G.day+10,'news_only',{head:"独占懸念",tag:'world',body:`${country.flag}${country.name}でGLOBAL CAPITALの市場支配力が${Math.round(t*100)}%を突破。規制当局が調査を検討していると報じられた。`});
      scheduleChain(G.day+20,'regulation_start',{countryId:country.id,head:"買収規制",body:`${country.flag}${country.name}政府がGLOBAL CAPITALに対する買収規制の導入を発表した。以後、この国での買収コストが上昇する。`});
    }
  });
}
function checkCountryConcentration(country, amount){
  if(!country) return;
  country._recentInvest=(country._recentInvest||0)+amount;
  const ratio=country._recentInvest/Math.max(country.gdp,1);
  if(ratio>0.05 && !country._tensionFlagged){
    country._tensionFlagged=true;
    country.tension=clamp((country.tension||0)+10,0,100);
    const rival=G.countries.find(c=>c.id===country.rivalId);
    if(rival){
      rival.tension=clamp((rival.tension||0)+6,0,100);
      scheduleChain(G.day+15,'news_only',{head:"外交摩擦",tag:'world',body:`GLOBAL CAPITALによる${country.flag}${country.name}への集中投資を受け、${rival.flag}${rival.name}が警戒感を強め、関税措置を検討していると報じられた。`});
    }
  }
}

const CONFLICT_NAMES=["国境紛争","内戦の激化","政治対立の激化","大規模な反政府デモ"];
function triggerCollapse(country){
  pendingForceBackup=true;
  country.collapsed=true; country.collapseRemaining=randInt(60,150); country.stability=8; country.conflict=null;
  G.companies.filter(co=>co.country===country.id).forEach(co=>{
    co.marketCap=Math.max(0.01, co.marketCap*rand(0.25,0.5));
    co.price=(co.marketCap*1e12)/co.shares;
    co.growth=-8;
  });
  country.gdpGrowth=-12; country.growthTendency=-6;
  country.unemployment=clamp(country.unemployment+15,0,60);
  country.happiness=clamp(country.happiness-25,0,100);
  const candidates=G.countries.filter(c=>c.id!==country.id && !c.collapsed && c.stability>50);
  const dest=candidates.length?pick(candidates):pick(G.countries.filter(c=>c.id!==country.id));
  const moved=Math.round(country.population*rand(0.03,0.08));
  country.population=Math.max(100,country.population-moved);
  if(dest){ dest.population+=moved; dest.growthTendency=clamp(dest.growthTendency+0.4,-5,12); dest.unemployment=clamp(dest.unemployment+1,0,60); }
  pushNews("国家崩壊",`${country.flag}${country.name}で政府機能が停止し、国家崩壊状態に陥った。株式市場は事実上停止し、多数の国民が${dest?dest.name:'周辺国'}へ移動している。`,"world",true);
  addHistory(`${country.flag}${country.name}が崩壊した。`);
  G.player.impact.nationsCollapsed++;
}
function triggerConflict(country){
  country.conflict={name:pick(CONFLICT_NAMES),remaining:randInt(30,80)};
  country.growthTendency=clamp(country.growthTendency-2.5,-5,12);
  country.happiness=clamp(country.happiness-10,0,100);
  pushNews("政情不安",`${country.flag}${country.name}で${country.conflict.name}が発生した。経済活動への影響が懸念されている。`,"world",true);
}
function updateCountryStability(c, days){
  if(c.collapsed){
    c.collapseRemaining-=days;
    if(c.collapseRemaining<=0){
      c.collapsed=false; c.stability=35; c.unrest=clamp(c.unrest-30,0,100);
      c.growthTendency=rand(1,3); c.gdpGrowth=rand(0.5,2);
      pushNews("復興",`${c.flag}${c.name}で新政府が樹立され、復興が始まった。`,"world",true);
      addHistory(`${c.flag}${c.name}で新政府が樹立され、復興が始まった。`);
      if((c.infraInvested||0)>0) G.player.impact.nationsSaved++;
    }
    return;
  }
  const target = 100 - c.unrest*0.6 - c.poverty*0.25 - clamp(c.inflation-8,0,40)*1.2 - clamp(30-c.govSupport,0,30) - ((c.tension||0)>70?15:0);
  c.stability=clamp(c.stability + (clamp(target,0,100)-c.stability)*0.06*(days/7) + normRand()*0.3*(days/7),0,100);
  if(c.conflict){
    c.conflict.remaining-=days;
    if(c.conflict.remaining<=0){
      pushNews("紛争終結",`${c.flag}${c.name}の${c.conflict.name}は沈静化に向かっている。`,"world");
      c.conflict=null;
    } else if(c.stability<15 && Math.random()<0.02*(days/7)){
      triggerCollapse(c); return;
    }
    return;
  }
  if(c.stability<20 && Math.random()<0.02*(days/7)){ triggerCollapse(c); }
  else if(c.stability<40 && c.unrest>55 && Math.random()<0.015*(days/7)){ triggerConflict(c); }
}

/* =========================================================================
   5b. NATIONAL INFLUENCE SYSTEM
   Player influence over a country's government is built from four channels
   (economic, corporate, media, policy) rather than a single "control" button.
   Policies succeed or fail based on government support, public opinion,
   the economy, media reach, and the relationship with the country's leader —
   never guaranteed just because influence is high.
   ========================================================================= */
function recalcCountryInfluence(country){
  if(!country) return;
  const compsInCountry=G.companies.filter(c=>c.country===country.id);
  const totalCap=compsInCountry.reduce((a,c)=>a+c.marketCap,0);
  const ownedCap=compsInCountry.reduce((a,c)=>a+(hShares(c.id)/c.shares)*c.marketCap,0);
  const corp=clamp((totalCap>0?ownedCap/totalCap:0)*140,0,100);
  const mediaComps=compsInCountry.filter(c=>c.sector==='メディア');
  const mediaTotal=mediaComps.reduce((a,c)=>a+c.marketCap,0);
  const mediaOwned=mediaComps.reduce((a,c)=>a+(hShares(c.id)/c.shares)*c.marketCap,0);
  const media=clamp((mediaTotal>0?(mediaOwned/mediaTotal)*90:0) + (mediaComps.some(c=>hShares(c.id)>0)?10:0),0,100);
  const econ=clamp(((country.infraInvested||0)/Math.max(country.gdp*0.05,0.5))*55 + (ownedCap/Math.max(country.gdp,1))*90,0,100);
  const policy=clamp(country._policyScore||0,0,100);
  const total=clamp(econ*0.30+corp*0.28+media*0.16+policy*0.26,0,100);
  country.influence={total,econ,corp,media,policy};
  [60,80].forEach(t=>{
    if(total>=t && (country._lastInfluenceFlag||0)<t){
      country._lastInfluenceFlag=t;
      const rival=G.countries.find(c=>c.id===country.rivalId);
      if(rival){
        rival.tension=clamp((rival.tension||0)+(t===80?10:6),0,100);
        scheduleChain(G.day+12,'news_only',{head:"他国が警戒",tag:'world',body:`GLOBAL CAPITALの${country.flag}${country.name}政府に対する影響力拡大を受け、${rival.flag}${rival.name}が外交的な警戒感を強めている。`});
      }
    }
  });
}
function lobbyActivity(countryId, amount){
  const c=G.countries.find(x=>x.id===countryId);
  if(!c) return {ok:false,msg:"国が見つかりません"};
  if(amount<=0) return {ok:false,msg:"金額を入力してください"};
  if(amount>G.player.cash) return {ok:false,msg:"資金が不足しています"};
  G.player.cash-=amount;
  c._policyScore=clamp((c._policyScore||0)+clamp(amount*3,2,25),0,150);
  c.politician.relation=clamp(c.politician.relation+rand(1,4),0,100);
  G.player.impact.totalInvested+=amount;
  pushNews("ロビー活動",`GLOBAL CAPITALが${c.flag}${c.name}でロビー活動・シンクタンクへの資金提供を実施した。`,'world');
  recalcCountryInfluence(c);
  saveGame();
  return {ok:true};
}

function checkInfluenceRisk(c, boosted){
  if(!c) return;
  const inf=c.influence?c.influence.total:0;
  let p = (inf>85? 0.05 : inf>70? 0.02 : inf>50? 0.007 : 0.0015);
  if(boosted) p*=1.6;
  if(Math.random()<p){
    if(inf>85 && Math.random()<0.4){
      c.approval=clamp(c.approval-rand(10,20),0,100);
      c._policyScore=Math.max(0,(c._policyScore||0)-20);
      c.unrest=clamp(c.unrest+rand(3,8),0,100);
      pushNews("スキャンダル報道",`${c.flag}${c.name}で「巨大投資グループ、政府との関係を巡り疑惑」との報道が広がっている。`,'world',true);
      pushSNS(`GLOBAL CAPITALと${c.name}政府の関係、さすがに近すぎない？`,"📰","scandal_watch");
      addHistory(`${c.flag}${c.name}でGLOBAL CAPITALの政治的影響力を巡るスキャンダルが報じられた。`);
    } else {
      const kind=pick(["メディアからの批判","国民の反発","野党の追及","独占禁止法に基づく調査","資産・出所に関する政府監査"]);
      c.approval=clamp(c.approval-rand(3,8),0,100);
      c._policyScore=Math.max(0,(c._policyScore||0)-8);
      pushNews("批判の高まり",`${c.flag}${c.name}でGLOBAL CAPITALに対する${kind}が強まっている。`,'world');
    }
  }
}
function proposePolicy(countryId, policyId){
  const c=G.countries.find(x=>x.id===countryId);
  const policy=POLICIES.find(p=>p.id===policyId);
  if(!c||!policy) return {ok:false,msg:"データが見つかりません"};
  recalcCountryInfluence(c);
  if(c.influence.total<policy.minInfluence) return {ok:false,msg:`必要な影響力（${policy.minInfluence}）に達していません（現在 ${c.influence.total.toFixed(0)}）`};
  if(policy.cost>G.player.cash) return {ok:false,msg:"資金が不足しています"};
  G.player.cash-=policy.cost;
  G.player.impact.totalInvested+=policy.cost;
  const supportFactor=(c.govSupport-50)/100;
  const opinionFactor=(c.happiness-50)/150;
  const econFactor=clamp(c.gdpGrowth/20,-0.3,0.3);
  const mediaFactor=(c.influence.media/100)*0.15;
  const relationFactor=((c.politician.relation-50)/100)*0.2;
  const influenceFactor=(c.influence.total/100)*0.35;
  const chance=clamp(0.35 + supportFactor*0.3 + opinionFactor + econFactor + mediaFactor + relationFactor + influenceFactor, 0.05, 0.92);
  const success=Math.random()<chance;
  const factors=[
   {label:'政府支持率',value:c.govSupport.toFixed(0)+'%'},
   {label:'国民世論（幸福度）',value:c.happiness.toFixed(0)},
   {label:'経済状況（GDP成長率）',value:c.gdpGrowth.toFixed(1)+'%'},
   {label:'メディア影響力',value:c.influence.media.toFixed(0)},
   {label:`${c.politician.title}との関係`,value:c.politician.relation.toFixed(0)},
   {label:'総合影響力',value:c.influence.total.toFixed(0)},
  ];
  const stars=clamp(Math.round(c.influence.total/20),1,5);
  if(success){
    policy.effect(c);
    c._policyScore=clamp((c._policyScore||0)+10,0,150);
    c.politician.relation=clamp(c.politician.relation+3,0,100);
    c.govSupport=clamp(c.govSupport+(Math.random()<0.5?2:-1),0,100);
    pushNews("政策成立",`${c.flag}${c.name}政府が「${policy.name}」を決定した。${policy.desc}`,'world',true);
    addHistory(`${c.flag}${c.name}で「${policy.name}」が成立した（GLOBAL CAPITALの働きかけ）。`);
  } else {
    c._policyScore=Math.max(0,(c._policyScore||0)-5);
    c.politician.relation=clamp(c.politician.relation-2,0,100);
    pushNews("政策見送り",`GLOBAL CAPITALが提言した「${policy.name}」は${c.flag}${c.name}政府に見送られた。`,'world');
  }
  checkInfluenceRisk(c, true);
  recalcCountryInfluence(c);
  saveGame();
  return {ok:true, success, factors, stars, policyName:policy.name, chance};
}

function resolveNegotiation(countryId, scenarioIdx, choiceIdx){
  const c=G.countries.find(x=>x.id===countryId);
  const scenario=NEGOTIATION_SCENARIOS[scenarioIdx];
  if(!c||!scenario) return {ok:false,msg:"データが見つかりません"};
  const choice=scenario.choices[choiceIdx];
  if(!choice) return {ok:false,msg:"選択が無効です"};
  if(choice.cost>G.player.cash) return {ok:false,msg:"資金が不足しています"};
  G.player.cash-=choice.cost;
  G.player.impact.totalInvested+=choice.cost;
  c._policyScore=clamp((c._policyScore||0)+choice.successBonus*40,0,150);
  c.politician.relation=clamp(c.politician.relation+choice.successBonus*30,0,100);
  if(choice.key==='reject'){
    pushNews("非公開交渉決裂",`GLOBAL CAPITALと${c.flag}${c.name}政府との非公開交渉は決裂した。`,'world');
  } else {
    pushNews("非公開交渉成立",`GLOBAL CAPITALと${c.flag}${c.name}政府の間で非公開の合意が成立したと関係者が語った。`,'world',true);
    addHistory(`GLOBAL CAPITALが${c.flag}${c.name}政府と非公開交渉で合意した。`);
  }
  recalcCountryInfluence(c);
  saveGame();
  return {ok:true};
}

function maybeTriggerCrisis(days){
  if(G.crisis){
    G.crisis.remaining-=days;
    if(G.crisis.remaining<=0){
      pushNews("危機の終息", `${G.crisis.name}の影響は徐々に和らぎ、市場は落ち着きを取り戻しつつある。`, "world");
      G.crisis=null;
    }
    return;
  }
  const bubbleBoost = G.macro.bubbleRisk>60 ? 0.02 : 0;
  const p = 0.0018*days + bubbleBoost;
  if(Math.random()<p){
    const c=pick(CRISIS_POOL);
    G.crisis={name:c.name, desc:c.desc, tag:c.tag, sectorHit:c.sectorHit, remaining:randInt(c.dur[0],c.dur[1])};
    G.macro.globalSentiment=clamp(G.macro.globalSentiment+c.sentiment,-100,100);
    G.macro.oilPrice=clamp(G.macro.oilPrice+c.oil,20,300);
    G.macro.bubbleRisk=Math.max(0,G.macro.bubbleRisk-30);
    pushNews("BREAKING", `${c.name}が発生。${c.desc}`, "world", true);
    pushSNS(`速報：${c.name}。市場が騒然としている。`, "🌐","market_watch");
    G.player.impact.crisesTriggered++;
    addHistory(`世界で${c.name}が発生した。`);
  }
}

function resourceLocalPrice(resource, country){ return resource.price * ((country.resourceMod&&country.resourceMod[resource.id])||1); }

function buyResource(resourceId, countryId, amountTrillion){
  const resource=G.resources.find(r=>r.id===resourceId);
  const country=G.countries.find(c=>c.id===countryId);
  if(!resource||!country) return {ok:false,msg:"データが見つかりません"};
  if(amountTrillion<=0) return {ok:false,msg:"金額を入力してください"};
  if(amountTrillion>G.player.cash) return {ok:false,msg:"資金が不足しています"};
  const localPrice=resourceLocalPrice(resource,country);
  const units=(amountTrillion*1e6)/localPrice;
  G.player.cash-=amountTrillion;
  G.player.resourceHoldings.push({id:uid('rh'),resource:resourceId,units,boughtCountry:countryId,boughtCountryName:country.name,boughtPrice:localPrice,boughtDay:G.day,investedAmount:amountTrillion});
  G.player.impact.totalInvested+=amountTrillion;
  G.player.recentActions.push({type:'resource_buy',resource:resourceId,amount:amountTrillion});
  if(resourceId==='oil' && amountTrillion>6) scheduleOilChain();
  pushNews("資源市場",`GLOBAL CAPITALが${country.flag}${country.name}で${resource.name}を${fmtYen(amountTrillion)}分取得した。`,"market");
  saveGame();
  return {ok:true};
}
function sellResourceHolding(holdingId, sellCountryId){
  const h=G.player.resourceHoldings.find(x=>x.id===holdingId);
  if(!h) return {ok:false,msg:"保有ポジションが見つかりません"};
  const resource=G.resources.find(r=>r.id===h.resource);
  const sellCountry=G.countries.find(c=>c.id===sellCountryId);
  if(!resource||!sellCountry) return {ok:false,msg:"データが見つかりません"};
  const sellLocal=resourceLocalPrice(resource,sellCountry);
  const transportCost = sellCountryId===h.boughtCountry?0.02:0.06;
  const revenue = (h.units*sellLocal/1e6)*(1-transportCost);
  G.player.cash+=revenue;
  G.player.resourceHoldings=G.player.resourceHoldings.filter(x=>x.id!==holdingId);
  const profit=revenue-h.investedAmount;
  pushNews("資源取引",`GLOBAL CAPITALが${resource.name}のポジションを${sellCountry.flag}${sellCountry.name}で決済し、${fmtYen(revenue)}を得た（${profit>=0?'利益':'損失'} ${fmtYen(Math.abs(profit))}）。`,"market");
  saveGame();
  return {ok:true, revenue};
}

function buyRealEstate(listingId){

  if(idx<0) return {ok:false,msg:"物件が見つかりません"};

function plantMonthlyNet(pl){
  const energyPrice=50*(G.macro.oilPrice/100)*0.5+25 + (G.crisis&&G.crisis.tag==='energy'?18:0);
  const revenue=pl.capacity*0.05*(energyPrice/50);
  const opex=pl.cost*pl.opexRate/12;
  let fuelCost=0;
  if(pl.fuel){ const r=G.resources.find(x=>x.id===pl.fuel); if(r) fuelCost=pl.capacity*0.01*(r.price/100); }
  return revenue-opex-fuelCost;

function investInfrastructure(countryId, amount){
  const c=G.countries.find(x=>x.id===countryId);
  if(!c) return {ok:false,msg:"国が見つかりません"};
  if(amount<=0) return {ok:false,msg:"金額を入力してください"};
  if(amount>G.player.cash) return {ok:false,msg:"資金が不足しています"};
  const wasUnstable=c.stability<45;
  G.player.cash-=amount;
  c.infraInvested=(c.infraInvested||0)+amount;
  G.player.impact.totalInvested+=amount;
  if(wasUnstable) G.player.impact.nationsSaved++;
  pushNews("国家投資",`GLOBAL CAPITALが${c.flag}${c.name}のインフラ整備に${fmtYen(amount)}を投資すると発表した。`, 'world', true);
  const strength=clamp(amount/Math.max(c.gdp,1)*100,0.5,8);
  scheduleChain(G.day+10,'news_only',{head:"物流改善",tag:'world',body:`${c.name}で道路・港湾インフラの改善が進み、物流効率が向上している。`});
  scheduleChain(G.day+20,'infra_boost',{countryId:c.id,delta:strength*0.4,delta2:strength*0.15,delta3:strength*0.3,delta4:strength*0.3,head:"企業コスト低下",body:`${c.name}で企業の物流・operatingコストが低下し、利益率が改善している。`});
  scheduleChain(G.day+34,'news_only',{head:"雇用拡大",tag:'world',body:`${c.name}でインフラ関連の雇用が拡大し、失業率に改善の兆しが見られる。`});
  scheduleChain(G.day+45,'news_only',{head:"国民生活の改善",tag:'world',body:`${c.name}の国民の間で生活実感の改善を感じる声が増えている。`});
  saveGame();
  return {ok:true};
}
function maybeSpawnContract(){
  if(G.contracts.filter(c=>c.status==='open').length>=6) return;
  if(Math.random()<0.02){
    const pool=G.countries.filter(x=>!x.collapsed);
    if(!pool.length) return;
    const c=pick(pool);
    const title=pick(CONTRACT_TITLES);
    const cost=clamp(c.gdp*rand(0.008,0.035),0.5,60);
    const reward=cost*rand(1.4,2.3);
    const successChance=clamp(0.5+(G.player.worldPower/220)+((c.stability||60)-50)/220,0.2,0.95);
    G.contracts.push({id:uid('ct'),countryId:c.id,countryName:c.name,flag:c.flag,title,cost,reward,successChance,status:'open',spawnDay:G.day,deadlineDay:G.day+randInt(20,45),resolveDay:null});
  }
}
function acceptContract(id){
  const ct=G.contracts.find(c=>c.id===id);
  if(!ct||ct.status!=='open') return {ok:false,msg:"案件が見つかりません"};
  if(ct.cost>G.player.cash) return {ok:false,msg:"資金が不足しています"};
  G.player.cash-=ct.cost;
  ct.status='active';
  ct.resolveDay=G.day+randInt(15,40);
  G.player.impact.totalInvested+=ct.cost;
  pushNews("国家案件受注",`GLOBAL CAPITALが${ct.flag}${ct.countryName}の「${ct.title}」を受注した。`,"mna");
  saveGame();
  return {ok:true};
}
function processContracts(){
  G.contracts=G.contracts.filter(ct=>{
    if(ct.status==='open' && G.day>ct.deadlineDay) return false;
    if(ct.status==='active' && ct.resolveDay!=null && G.day>=ct.resolveDay){
      const c=G.countries.find(x=>x.id===ct.countryId);
      const success=Math.random()<ct.successChance;
      if(success){
        G.player.cash+=ct.reward;
        if(c && !c.collapsed){ c.happiness=clamp(c.happiness+3,0,100); c.govSupport=clamp(c.govSupport+4,0,100); c.growthTendency=clamp(c.growthTendency+0.3,-5,12); }
        pushNews("国家案件成功",`GLOBAL CAPITALが受注した${ct.flag}${ct.countryName}の「${ct.title}」が成功裏に完了し、${fmtYen(ct.reward)}の収益を得た。`,'mna',true);
        if(ct.reward>20) addHistory(`${ct.flag}${ct.countryName}で「${ct.title}」が成功した。`);
      } else {
        G.player.cash+=ct.cost*0.2;
        if(c) c.govSupport=clamp(c.govSupport-2,0,100);
        pushNews("国家案件失敗",`GLOBAL CAPITALが受注した${ct.flag}${ct.countryName}の「${ct.title}」は計画通りに進まず、大きな損失となった。`,'mna');
      }
      return false;
    }
    return true;
  });
}

/* =========================================================================
   10. SIMULATION (per-day loop; drives candles + all systems)
   ========================================================================= */
function simulateDay(){
  const scale=1/7; // formulas tuned against a 7-day baseline
  const m=G.macro;

  m.oilPrice=clamp(m.oilPrice + normRand()*2.2*scale + (m.oilPrice>100? -0.3*scale : 0.3*scale), 25,300);
  const oilDelta=(m.oilPrice-100)/100;

  let sentDrift = -m.globalSentiment*0.06*scale + normRand()*4*scale;
  if(m.bubbleRisk>70 && Math.random()<0.15*scale) sentDrift -= rand(15,40);
  m.globalSentiment=clamp(m.globalSentiment+sentDrift,-100,100);
  m.bubbleRisk=clamp(m.bubbleRisk - 1.2*scale, 0, 100);
  m.tradeMomentum=clamp(m.tradeMomentum - 0.5*scale,-100,100);

  const avgInflation=G.countries.reduce((a,c)=>a+c.inflation,0)/G.countries.length;
  m.globalRate = clamp(m.globalRate + ((avgInflation-1.5) - m.globalRate)*0.03*scale,0,20);

  // resources
  G.resources.forEach(r=>{
    let drift=normRand()*r.vol*scale + (m.globalSentiment/100)*0.4*scale;
    if(G.crisis){
      if(G.crisis.tag==='energy' && (r.id==='oil'||r.id==='gas'||r.id==='uranium')) drift+=rand(0.5,1.5)*scale*3;
      if(G.crisis.tag==='food' && r.id==='food') drift+=rand(0.6,1.8)*scale*3;
    }
    r.price=clamp(r.price*(1+drift*0.01), r.base*0.3, r.base*4.5);
  });

  // countries
  G.countries.forEach(c=>{
    if(c.collapsed){ updateCountryStability(c,1); return; }
    const inflPressure = oilDelta*2.2 + (m.globalSentiment<-30?0.6:0) + normRand()*0.15*scale;
    c.inflation = clamp(c.inflation + ((c.inflationTarget+inflPressure)-c.inflation)*0.12*scale + normRand()*0.1*scale, -2, 40);
    const rateTarget = Math.max(0, (c.inflation-1.5)*1.1);
    c.rate = clamp(c.rate + (rateTarget-c.rate)*0.06*scale, 0, 30);
    const conflictPenalty = c.conflict? -2.5:0;
    const growthShock = (m.globalSentiment/100)*1.6 - (c.rate-3.5)*0.12 - (c.inflation>6? (c.inflation-6)*0.08:0) + conflictPenalty;
    c.gdpGrowth = clamp(c.gdpGrowth + (c.growthTendency+growthShock - c.gdpGrowth)*0.1*scale + normRand()*0.12*scale, -14, 14);
    c.gdp = Math.max(1, c.gdp*(1+ (c.gdpGrowth/100)*(1/365)));
    c.unemployment = clamp(c.unemployment - (c.gdpGrowth-2)*0.06*scale + normRand()*0.08*scale, 0.5, 50);
    c.poverty = clamp(c.poverty + (c.unemployment-5)*0.02*scale + normRand()*0.05*scale, 1, 70);
    c.inequality = clamp(c.inequality + normRand()*0.06*scale, 5, 85);
    const stress = (c.inflation-2)*0.5 + (c.unemployment-5)*0.6 + (c.inequality-40)*0.15;
    c.happiness = clamp(c.happiness - stress*0.05*scale + normRand()*0.3*scale, 0, 100);
    c.unrest = clamp(c.unrest + stress*0.06*scale - (c.happiness-50)*0.02*scale + normRand()*0.3*scale, 0, 100);
    c.govSupport = clamp(c.govSupport + (c.happiness-50)*0.04*scale - c.unrest*0.02*scale + normRand()*0.3*scale, 0, 100);
    c.approval = clamp(c.approval + (50-c.approval)*0.01*scale + normRand()*0.15*scale, 0, 100);
    c.tension = clamp((c.tension||10) + (10-(c.tension||10))*0.02*scale + normRand()*0.1*scale, 0, 100);
    if(c._recentInvest) c._recentInvest*=0.98;
    c._policyScore=Math.max(0,(c._policyScore||0)-0.03);
    c.politician.relation=clamp(c.politician.relation+(50-c.politician.relation)*0.01,0,100);
    c.politician.approval=clamp(c.politician.approval+(c.govSupport-c.politician.approval)*0.05+normRand()*0.2,0,100);
    recalcCountryInfluence(c);
    checkInfluenceRisk(c, false);
    updateCountryStability(c,1);
  });

  // companies (+ daily candle)
  let prevOwnedEmployees=0;
  G.companies.forEach(co=>{ if(hShares(co.id)>0) prevOwnedEmployees+=co.employees; });

  G.companies.forEach(co=>{
    if(co.bankrupt) return;
    const country=G.countries.find(x=>x.id===co.country);
    const collapsed=country&&country.collapsed;
    const priceBefore=co.price;
    const pctOwned=ownershipPct(co);
    let controlBonus=0;
    if(pctOwned>=50){
      const strat=G.player.strategies[co.id]||"hold";
      controlBonus = strat==="growth"?2.2: strat==="cost"?0.6 : strat==="rnd"?1.2 : 0.3;
      if(strat==="cost") co.volatility=Math.max(0.4,co.volatility-0.01*scale);
      if(strat==="rnd") co.tech=clamp(co.tech+0.05*scale,0,100);
    }
    const sectorHitPenalty = (G.crisis && G.crisis.sectorHit===co.sector) ? -3.5 : 0;
    const collapsePenalty = collapsed? -20:0;
    const countryFactor = country ? (country.gdpGrowth-2)*0.15 : 0;
    const dailyDrift = ( (co.growth+controlBonus)/100 ) * (1/365);
    const sentimentFactor = (m.globalSentiment/100)*0.5*scale/7 + sectorHitPenalty*scale/30 + collapsePenalty*scale/30;
    const noise = normRand()*(co.volatility/100)*Math.sqrt(scale);
    const pctChange = dailyDrift + sentimentFactor + noise + countryFactor*scale/30;
    co.prevCap=co.marketCap;
    co.marketCap=Math.max(0.01, co.marketCap*(1+pctChange));
    co.price=(co.marketCap*1e12)/co.shares;
    co.revenue=Math.max(0.01, co.revenue*(1+(co.growth/100)*(1/365)*0.6));
    co.profit=co.revenue*clamp((co.profit/Math.max(co.revenue,0.01))+normRand()*0.01,-0.15,0.28);
    co.employees=Math.max(50,Math.round(co.employees*(1+(co.growth/100)*(1/365)*0.3)));

    const O=priceBefore, C=co.price;
    const wick=Math.abs(co.volatility/100)*rand(0.3,1.1)*(O+C)/2;
    const H=Math.max(O,C)+wick*rand(0,0.6);
    const L=Math.max(0.01,Math.min(O,C)-wick*rand(0,0.6));
    const vol=Math.round(co.marketCap*8 + (co._todayVolumeShares||0)/1e5);
    co.candles.push({d:G.day+1,o:Math.round(O),h:Math.round(H),l:Math.round(L),c:Math.round(C),v:vol});
    if(co.candles.length>400) co.candles.shift();
    co._todayVolumeShares=0;
  });

  let newOwnedEmployees=0;
  G.companies.forEach(co=>{ if(hShares(co.id)>0) newOwnedEmployees+=co.employees; });
  const empDelta=newOwnedEmployees-prevOwnedEmployees;
  if(empDelta>0) G.player.impact.jobsCreated+=empDelta; else G.player.impact.jobsLost+=(-empDelta);

  G.day+=1;
  processChainQueue();
  maybeTriggerCrisis(1);
  maybeSpawnContract();
  processContracts();
  if(G.day%30===0) collectMonthly();

  recalcWorldPower();
  G.player.history.push({day:G.day, netWorth:netWorth()});
  if(G.player.history.length>240) G.player.history.shift();
  maybeGenerateNews();
  maybeGenerateSNS();
  if(G.day%20===0){ G.realEstateListings.push(makeListing(pick(G.countries.filter(c=>c.major)))); if(G.realEstateListings.length>16) G.realEstateListings.shift(); }
  G.player.recentActions=[];
}
function simulateStep(days){ for(let i=0;i<days;i++) simulateDay(); }

function collectMonthly(){
  let total=0;
  G.companies.forEach(co=>{
    const sh=hShares(co.id); if(sh<=0) return;
    const pct=sh/co.shares;
    const payout = pct>=0.5?0.4:0.15;
    const div=Math.max(0,co.profit)*pct*payout/12;
    if(div>0){ G.player.cash+=div; total+=div; }
  });
  G.player.realEstate.forEach(p=>{
    const country=G.countries.find(c=>c.id===p.countryId);
    if(country && !country.collapsed){
      p.occupancy=clamp(p.occupancy + (country.gdpGrowth-2)*0.01,0.25,0.99);
      p.landValue=Math.max(0.01,p.landValue*(1+(country.gdpGrowth/100)/12));
    } else if(country&&country.collapsed){ p.occupancy=clamp(p.occupancy-0.1,0.1,0.99); p.landValue*=0.9; }
    const net=p.rent*p.occupancy-p.maintenance;
    G.player.cash+=net; total+=net;
  });
  G.player.plants.forEach(pl=>{ const net=plantMonthlyNet(pl); G.player.cash+=net; total+=net; });
  if(G.player.bank){
    const b=G.player.bank;
    const interest=b.capital*rand(0.05,0.09)/12;
    b.capital+=interest; total+=interest;
    const instability=G.countries.filter(c=>c.collapsed||c.stability<30).length;
    if(instability>0 && Math.random()<0.25){
      const loss=b.capital*rand(0.04,0.15)*Math.min(instability,4)/4;
      b.capital=Math.max(0,b.capital-loss);
      pushNews("銀行損失",`GLOBAL CAPITAL傘下銀行で貸倒損失${fmtYen(loss)}が発生した。`,'world');
    }
  }
  G.player.patents.forEach(pt=>{ const inc=pt.annualIncome/12; G.player.cash+=inc; total+=inc; });
  if(total>0.005) pushNews("月次収益",`不動産・エネルギー・配当・特許収入などから今月は${fmtYen(total)}の副収入があった。`, 'world');
}

/* =========================================================================
   11. ORDER BOOK (板情報 — visual depth) & SHARE-BASED TRADING / ACQUISITIONS
   The order book below is generated as a believable snapshot of nearby bid/ask
   depth for the UI. Actual execution price impact uses a bounded closed-form
   model keyed to (shares traded / shares outstanding), so arbitrarily large
   "god view" orders always fill fully without blowing up or under-filling.
   ========================================================================= */
function generateOrderBook(co){
  const levels=6;
  const stepPct = 0.12*(1+co.volatility/4); // % per level, cosmetic only
  const liquidityUnit = co.shares*rand(0.00004,0.00025);
  const asks=[]; let ap=co.price;
  for(let i=1;i<=levels;i++){ ap=ap*(1+stepPct/100); asks.push({price:ap, shares:Math.round(liquidityUnit*rand(0.6,1.6)*(1+i*0.15))}); }
  const bids=[]; let bp=co.price;
  for(let i=1;i<=levels;i++){ bp=bp*(1-stepPct/100); bids.push({price:Math.max(bp,0.01), shares:Math.round(liquidityUnit*rand(0.6,1.6)*(1+i*0.15))}); }
  return {asks, bids, stepPct};
}
function quoteOrder(co, shares, dir, country){
  const ratio = Math.abs(shares)/Math.max(co.shares,1);
  const impactFactor = (country&&country.regulatedUntil>G.day)?0.6:0.9;
  const impact = clamp(ratio*impactFactor*8, 0, 0.85) * (dir>0?1:-1);
  const avgPrice = Math.max(0.01, co.price*(1+impact/2));
  const lastPrice = Math.max(0.01, co.price*(1+impact));
  const cost = shares*avgPrice;
  return {cost, executed:shares, avgPrice, lastPrice, impact};
}
function buyStockByShares(coId, shares){
  const co=G.companies.find(c=>c.id===coId);
  if(!co) return {ok:false,msg:"企業が見つかりません"};
  shares=Math.floor(shares);
  if(!(shares>0)) return {ok:false,msg:"株数を入力してください"};
  const country=G.countries.find(c=>c.id===co.country);
  const q=quoteOrder(co, shares, +1, country);
  const costTrillion=q.cost/1e12;
  if(costTrillion>G.player.cash) return {ok:false,msg:"資金が不足しています"};
  G.player.cash-=costTrillion;
  addHolding(coId, shares, costTrillion);
  co._todayVolumeShares=(co._todayVolumeShares||0)+shares;
  co.marketCap=Math.max(0.01,(q.lastPrice*co.shares)/1e12);
  co.price=q.lastPrice;
  G.macro.tradeMomentum=clamp(G.macro.tradeMomentum+q.impact*40,-100,100);
  G.macro.bubbleRisk=clamp(G.macro.bubbleRisk + Math.abs(q.impact)*25,0,100);
  G.player.recentActions.push({type:'buy',co:co.id,amount:costTrillion});
  G.player.impact.totalInvested+=costTrillion;
  pushNews("市場動向", `GLOBAL CAPITALが${co.countryName}の${co.name}株を${fmtNum(shares,0)}株（${fmtYen(costTrillion)}分）取得。株価は${fmtPct(q.impact*100)}動いた。`, "market");
  if(costTrillion>10) checkCountryConcentration(country, costTrillion);
  checkMonopolyAndTrigger(country);
  if(country && ownershipPct(co)>=50 && !co._controlHistoryLogged){ co._controlHistoryLogged=true; if(co.marketCap>40) addHistory(`GLOBAL CAPITALが${co.flag}${co.name}の経営権を取得した。`); }
  if(G.tutorial && G.tutorial.active && coId===G.tutorial.novaId){ G.tutorial.flags.boughtNova=true; }
  recalcWorldPower();
  saveGame();
  return {ok:true, executed:shares, cost:costTrillion, avgPrice:q.avgPrice};
}
function sellStockByShares(coId, shares){
  const co=G.companies.find(c=>c.id===coId);
  if(!co) return {ok:false,msg:"企業が見つかりません"};
  shares=Math.floor(shares);
  const owned=hShares(coId);
  if(!(shares>0)) return {ok:false,msg:"株数を入力してください"};
  if(shares>owned) return {ok:false,msg:"保有株数を超えています"};
  const country=G.countries.find(c=>c.id===co.country);
  const q=quoteOrder(co, shares, -1, country);
  const proceedsTrillion=q.cost/1e12;
  reduceHolding(coId, shares);
  co._todayVolumeShares=(co._todayVolumeShares||0)+shares;
  G.player.cash+=proceedsTrillion;
  co.marketCap=Math.max(0.01,(q.lastPrice*co.shares)/1e12);
  co.price=q.lastPrice;
  G.macro.tradeMomentum=clamp(G.macro.tradeMomentum+q.impact*40,-100,100);
  G.macro.bubbleRisk=clamp(G.macro.bubbleRisk + Math.abs(q.impact)*15,0,100);
  G.player.recentActions.push({type:'sell',co:co.id,amount:proceedsTrillion});
  pushNews("市場動向", `GLOBAL CAPITALが${co.countryName}の${co.name}株を${fmtNum(shares,0)}株（${fmtYen(proceedsTrillion)}分）売却。株価は${fmtPct(q.impact*100)}動いた。`, "market");
  if(Math.abs(q.impact)>0.3){
    scheduleChain(G.day+5,'sentiment_down',{delta:rand(15,30),head:"投資家心理の悪化",body:"大量売却をきっかけに投資家心理が急速に悪化し、市場ではパニック的な売りが広がっている。"});
    scheduleChain(G.day+6,'crisis_boost',{delta:25});
  }
  if(G.tutorial && G.tutorial.active && Math.abs(q.impact)>0.15){ G.tutorial.flags.didBigSell=true; }
  recalcWorldPower();
  saveGame();
  return {ok:true, executed:shares, proceeds:proceedsTrillion, avgPrice:q.avgPrice};
}
function tenderOffer(coId, targetPct){
  const co=G.companies.find(c=>c.id===coId);
  if(!co) return {ok:false,msg:"企業が見つかりません"};
  const country=G.countries.find(c=>c.id===co.country);
  const currentShares=hShares(coId);
  const targetShares=co.shares*(targetPct/100);
  if(targetShares<=currentShares) return {ok:false,msg:"既に目標比率に達しています"};
  const needShares=targetShares-currentShares;
  const premium=(country&&country.regulatedUntil>G.day)?1.35:1.22;
  const cost=(needShares*co.price*premium)/1e12;
  if(cost>G.player.cash) return {ok:false,msg:`資金不足：必要額 ${fmtYen(cost)}`};
  G.player.cash-=cost;
  addHolding(coId, needShares, cost);
  co._todayVolumeShares=(co._todayVolumeShares||0)+needShares;
  const capImpact=clamp((cost/co.marketCap)*0.6,0,0.9);
  co.marketCap=co.marketCap*(1+capImpact);
  co.price=(co.marketCap*1e12)/co.shares;
  G.player.recentActions.push({type:'tob',co:co.id,pct:targetPct});
  G.player.impact.totalInvested+=cost;
  pushNews("公開買付", `GLOBAL CAPITAL、${co.countryName}の${co.name}に対しTOB（株式公開買付）を実施し、保有比率を${targetPct}%に引き上げ。プレミアムは${Math.round((premium-1)*100)}%。`, "mna", true);
  pushSNS(`${co.name}がまたGLOBAL CAPITALに買われた…この会社どこまで大きくなるんだ。`,"📊","trader_anon");
  if(cost>40) addHistory(`GLOBAL CAPITALが${co.flag}${co.name}（${co.countryName}）を大型買収した。`);
  checkMonopolyAndTrigger(country);
  if(cost>10) checkCountryConcentration(country, cost);
  if(G.tutorial && G.tutorial.active){ G.tutorial.flags.didTOB=true; }
  recalcWorldPower();
  saveGame();
  return {ok:true};
}
function setStrategy(coId, strat){
  G.player.strategies[coId]=strat;
  const co=G.companies.find(c=>c.id===coId);
  const label={growth:"成長重視",cost:"コスト削減",rnd:"研究開発強化",hold:"現状維持"}[strat];
  pushNews("経営方針変更", `GLOBAL CAPITAL傘下の${co.name}が経営方針を「${label}」に変更した。`, "mna");
  saveGame();
}

function generateVoices(country, count=6){
  const templates=genVoiceTemplates(country);
  const history=G.voiceLog[country.id]=G.voiceLog[country.id]||[];
  const out=[];
  const roles=Object.keys(templates);
  for(let i=0;i<count && i<roles.length*2;i++){
    const role=roles[i%roles.length];
    const pool=templates[role];
    let text, tries=0;
    do{ text=pick(pool); tries++; }while(history.includes(text)&&tries<6);
    out.push({role,text});
    history.push(text);
    if(history.length>40) history.shift();
  }
  return out;
}

async function generateAIVoices(country){
  const recentNews=G.news.slice(0,5).map(n=>n.head+": "+n.body).join(" / ");
  const situation = country.collapsed?"この国は現在、国家崩壊状態にある。": country.conflict?`この国は現在「${country.conflict.name}」の渦中にある。`:"";
  const prompt=`あなたは経済シミュレーションゲームの「国民の声」生成エンジンです。以下の情報をもとに、実在しない架空の市民6人分の短いコメント（各40〜90文字程度、日本語）をJSON配列で生成してください。
国: ${country.name}
GDP成長率: ${country.gdpGrowth.toFixed(1)}%
インフレ率: ${country.inflation.toFixed(1)}%
失業率: ${country.unemployment.toFixed(1)}%
国民幸福度: ${country.happiness.toFixed(0)}/100
社会不安: ${country.unrest.toFixed(0)}/100
政情安定度: ${(country.stability||60).toFixed(0)}/100
${situation}
プレイヤー(投資会社GLOBAL CAPITAL)への評価: ${country.approval.toFixed(0)}/100
プレイヤーのWORLD POWER: ${G.player.worldPower}
プレイヤーのこの国の政府への政治的影響力: ${(country.influence&&country.influence.total||0).toFixed(0)}/100（50以上で政府の政策への影響が疑われ始め、75以上だと国民や評論家がその存在を明確に意識する）
最近のニュース: ${recentNews||"特になし"}

6人の属性はそれぞれ「市民」「投資家」「若者」「高齢者」「経営者」「失業者」とし、それぞれの立場から自然な、互いに異なる視点のコメントにしてください。同じ言い回しの繰り返しは禁止です。国家崩壊や紛争の状況にある場合はそれを反映した切実な内容にしてください。政治的影響力が高い場合は、政府とGLOBAL CAPITALの関係を疑問視・評価する声も混ぜてください。
出力は必ず次のJSON形式のみ。前置きや説明文、コードブロック記号は一切付けないでください:
[{"role":"市民","text":"..."},{"role":"投資家","text":"..."},{"role":"若者","text":"..."},{"role":"高齢者","text":"..."},{"role":"経営者","text":"..."},{"role":"失業者","text":"..."}]`;
  const response=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user",content:prompt}] })
  });
  const data=await response.json();
  const textBlocks=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const cleaned=textBlocks.replace(/```json|```/g,"").trim();
  const parsed=JSON.parse(cleaned);
  if(!Array.isArray(parsed)) throw new Error("unexpected format");
  return parsed;
}

function ensureNovaTech(){
  let co=G.companies.find(c=>c.isTutorial);

  const japan=G.countries.find(c=>c.name==="日本")||G.countries[0];
  co={
    id:uid('co'), name:"NOVA TECH", country:japan.id, countryName:japan.name, flag:japan.flag,
    sector:"IT", marketCap:0.5, price:5000, shares:1e8,
    revenue:0.2, profit:0.015, employees:1200,
    debt:0.05, cashRes:0.1, brand:35, tech:55,
    growth:5, volatility:2.2, prevCap:0.5, bankrupt:false, founder:false, patented:false,
    candles:[], _todayVolumeShares:0, isTutorial:true,
  };
  G.companies.push(co);
  return co;
}
function ensureStruggleCountry(){
  if(G.tutorial.struggleId){
    const existing=G.countries.find(c=>c.id===G.tutorial.struggleId);
    if(existing) return existing;
  }
  let c=G.countries.find(cc=>cc.name==="アルゼンチン") || G.countries.find(cc=>!cc.major);
  if(c){
    c.gdpGrowth=-2; c.growthTendency=-1; c.unemployment=12; c.inflation=9;
    c.happiness=clamp(c.happiness,20,42);
  }
  G.tutorial.struggleId=c?c.id:null;
  return c;
}
function startTutorial(){
  ensureNovaTech();
  ensureStruggleCountry();
  const worldGdp=G.countries.reduce((a,c)=>a+c.gdp,0);
  const avgHappiness=G.countries.reduce((a,c)=>a+c.happiness,0)/G.countries.length;
  const avgApproval=G.countries.reduce((a,c)=>a+c.approval,0)/G.countries.length;
  G.tutorial={
    active:true, step:0, flags:{}, skipped:false, completed:false,
    novaId:G.companies.find(c=>c.isTutorial).id,
    struggleId:G.tutorial?G.tutorial.struggleId:null,
    startSnapshot:{ day:G.day, cash:G.player.cash, worldGdp, avgHappiness, avgApproval, worldPower:G.player.worldPower },
  };
  ensureStruggleCountry();
  saveGame();
}
function endTutorial(skipped){
  G.tutorial.active=false;
  G.tutorial.completed=!skipped;
  G.tutorial.skipped=!!skipped;
  saveGame();
  renderTutorialUI();
  renderAll();
}

function tutorialCurrentStep(){ return TUTORIAL_STEPS[G.tutorial.step]; }
function checkTutorialProgress(){
  if(!G || !G.tutorial || !G.tutorial.active) return;
  const step=tutorialCurrentStep();
  if(!step || step.fullscreen) return;
  if(step.check && step.check(G)){ advanceTutorialStep(); }
}
function advanceTutorialStep(){
  const finishedStep=tutorialCurrentStep();
  G.tutorial.step++;
  const next=tutorialCurrentStep();
  if(!next){ G.tutorial.completed=true; G.tutorial.active=false; saveGame(); renderTutorialUI(); return; }
  if(next.onEnter) next.onEnter(G);
  if(next.targetScreen) switchScreen(next.targetScreen);
  saveGame();
  renderTutorialUI();
  renderAll();
}
function tutorialSkip(){
  if(!confirm("チュートリアルをスキップしますか？")) return;
  endTutorial(true);
}

  if(step.lines3){ html+=`<div style="height:14px;"></div>`; step.lines3.forEach((l,i)=>html+=`<div class="tut-line small" style="animation-delay:${i*0.12}s">${escapeHtml(l)}</div>`); }

    <div class="tut-lines"><div class="tut-line">チュートリアル終了</div></div>
    <div class="tut-summary-table">
      <div class="tut-summary-row" style="color:var(--dim);font-size:10.5px;"><span>指標</span><span>開始時 → 現在</span></div>
      ${rows.map(r=>`<div class="tut-summary-row"><span>${r[0]}</span><span class="mono">${r[1]} → <span class="gold">${r[2]}</span></span></div>`).join('')}
    </div>
    <div class="tut-lines">
      <div class="tut-line small">ここから先に正解はありません。</div>
      <div class="tut-line small">金を増やすのか。企業を支配するのか。国家を救うのか。</div>
      <div class="tut-line small">世界を豊かにするのか。世界を混乱させるのか。</div>
      <div class="tut-line small">あなたの行動が、この世界の歴史になります。</div>
    </div>`;

}
function renderTutorialUI(){
  const overlay=document.getElementById('tutorial-overlay');
  const banner=document.getElementById('tutorial-banner');
  if(!G.tutorial || !G.tutorial.active){ overlay.style.display='none'; banner.style.display='none'; overlay.innerHTML=''; banner.innerHTML=''; return; }
  const step=tutorialCurrentStep();
  if(!step){ overlay.style.display='none'; banner.style.display='none'; overlay.innerHTML=''; banner.innerHTML=''; return; }
  if(step.fullscreen){
    banner.style.display='none'; banner.innerHTML='';
    overlay.style.display='flex';
    const bodyHtml = step.isFinal ? tutorialFinalHtml() : fullscreenLinesHtml(step);
    const actionsHtml = step.isFinal
      ? `<div class="tut-actions"><button class="btn primary" id="tut-next" style="padding:13px 34px;">自由に世界を動かす</button></div>`
      : `<div class="tut-actions"><button class="btn primary" id="tut-next" style="padding:12px 30px;">次へ</button><button class="tut-skip" id="tut-skip">チュートリアルをスキップ</button></div>`;
    overlay.innerHTML = `<div class="tut-wrap">${bodyHtml}${actionsHtml}</div>`;
    document.getElementById('tut-next').addEventListener('click',()=>{
      if(step.isFinal){ endTutorial(false); } else { advanceTutorialStep(); }
    });
    const skipBtn=document.getElementById('tut-skip');
    if(skipBtn) skipBtn.addEventListener('click', tutorialSkip);
  } else {
    overlay.style.display='none'; overlay.innerHTML='';
    banner.style.display='flex';
    const instr = typeof step.instruction==='function' ? step.instruction(G) : step.instruction;
    banner.innerHTML = `
      <div class="tut-step-label">${step.badge} ・ ${escapeHtml(step.title||'')}</div>
      <div class="tut-instruction">${escapeHtml(instr)}</div>
      <div class="tut-banner-row"><button class="tut-skip" id="tut-skip-banner">スキップ</button></div>
    `;
    document.getElementById('tut-skip-banner').addEventListener('click', tutorialSkip);
  }
}

let currentScreen="world";
let openModalKind=null; // 'company' | 'settings' | 'negotiation' | null
let openModalCompanyId=null;

/* Preserve scroll position and focused-input state across a "background"
   re-render (e.g. triggered by the clock advancing), so the player's current
   view, filters, chart timeframe, and any in-progress typing are not reset.
   Explicit navigation (switchScreen) intentionally still resets scroll. */
function withPreservedUIState(fn){
  const contentEl=document.getElementById('content');
  const prevScrollTop=contentEl.scrollTop;
  const prevScrollHeight=contentEl.scrollHeight;
  const active=document.activeElement;
  let focusInfo=null;
  if(active && contentEl.contains(active) && (active.tagName==='INPUT'||active.tagName==='SELECT'||active.tagName==='TEXTAREA')){
    focusInfo={id:active.id, value:active.value, selStart:active.selectionStart, selEnd:active.selectionEnd, tag:active.tagName};
  }
  fn();
  if(focusInfo && focusInfo.id){
    const el=document.getElementById(focusInfo.id);
    if(el){
      el.value=focusInfo.value;
      try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
      if(focusInfo.tag!=='SELECT' && el.setSelectionRange){ try{ el.setSelectionRange(focusInfo.selStart,focusInfo.selEnd); }catch(e){} }
    }
  }
  const newScrollHeight=contentEl.scrollHeight;
  const delta=newScrollHeight-prevScrollHeight;
  contentEl.scrollTop=prevScrollTop+delta;
}
function switchScreen(name){
  currentScreen=name;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.screen===name));
  renderScreen(name);
  document.getElementById('content').scrollTop=0;
  if(G && G.tutorial && G.tutorial.active && name==='people'){ G.tutorial.flags.visitedPeopleStep=true; }
  checkTutorialProgress();
  renderTutorialUI();
}
function renderAll(){
  renderTopbar();
  withPreservedUIState(()=>renderScreen(currentScreen));
  refreshCompanyModalIfOpen();
  checkTutorialProgress();
  renderTutorialUI();
}
function refreshCompanyModalIfOpen(){
  if(openModalKind!=='company' || !openModalCompanyId) return;
  const modalLayer=document.getElementById('modal-layer');
  if(!modalLayer || !modalLayer.classList.contains('open')) return;
  const co=G.companies.find(c=>c.id===openModalCompanyId);
  if(!co){ closeModal(); return; }
  const buyEl=document.getElementById('buy-shares');
  const sellEl=document.getElementById('sell-shares');
  const buyVal=buyEl?buyEl.value:null;
  const sellVal=sellEl?sellEl.value:null;
  const activeEl=document.activeElement;
  const activeId=activeEl?activeEl.id:null;
  const selStart=(activeEl&&activeEl.selectionStart!==undefined)?activeEl.selectionStart:null;
  const modalBody=document.getElementById('modal-body');
  const prevScrollTop=modalBody?modalBody.scrollTop:0;
  openCompanyModal(co.id, {silent:true});
  const newBuyEl=document.getElementById('buy-shares');
  const newSellEl=document.getElementById('sell-shares');
  if(newBuyEl && buyVal!==null){ newBuyEl.value=buyVal; newBuyEl.dispatchEvent(new Event('input')); }
  if(newSellEl && sellVal!==null){ newSellEl.value=sellVal; newSellEl.dispatchEvent(new Event('input')); }
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){
      try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selStart); }catch(e){} }
    }
  }
  const newModalBody=document.getElementById('modal-body');
  if(newModalBody) newModalBody.scrollTop=prevScrollTop;
}
function renderScreen(name){
  if(name==="world") renderWorld();
  else if(name==="market") renderMarket();
